packages:
  - 'packages/*'
  - 'apps/*'
  - 'server'

# pnpm catalog — single source of truth for shared dev-dependency versions.
# Reference with "catalog:" in any package.json devDependencies.
# Docs: https://pnpm.io/catalogs
catalog:
  typescript: '^6.0.3'
  vitest: '^4.1.7'
  eslint: '^10.4.0'
  typescript-eslint: '^8.59.4'
  prettier: '^3.8.3'
  vite: '^8.0.14'

# allowBuilds controls which packages may run postinstall scripts during pnpm install.
# esbuild, onnxruntime-node, protobufjs, and sharp are blocked as a supply-chain
# security measure — postinstall scripts can execute arbitrary code. esbuild's pure-JS
# fallback is functionally correct; the native binary works in environments where it was
# pre-installed (CI runners, dev machines). Decision documented in DECISIONS.md ADR-M-014.
allowBuilds:
  esbuild: false
  msgpackr-extract: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false

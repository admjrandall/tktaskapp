name: tktaskapp

services:
  # ── Application server ──────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tktaskapp
      POSTGRES_USER: tktaskapp
      # Set POSTGRES_PASSWORD in .env.local — never commit a real password here
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tktaskapp -d tktaskapp']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  # ── OpenTelemetry Collector ─────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317' # gRPC OTLP receiver
      - '4318:4318' # HTTP OTLP receiver
    depends_on:
      - jaeger
    restart: unless-stopped
    networks:
      - backend

  # ── Jaeger (all-in-one) for local trace visualisation ──────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - '16686:16686' # Jaeger UI
      - '14250:14250' # gRPC model.proto receiver (used by otel-collector)
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge

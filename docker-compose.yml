# Dev-only compose stack. Production deployments must use managed Postgres,
# pinned runtime images, external secret management, and the Kubernetes manifests.
name: tktaskapp

services:
  # ── Database migrations ─────────────────────────────────────────────────────
  # Runs dist/migrate.js once and exits with code 0 on success.
  # The server waits for this to complete (condition: service_completed_successfully)
  # so it never starts against an un-migrated schema.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ['dist/migrate.js']
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks:
      - backend

  # ── Application server ──────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed to the host for local tooling: DBeaver, psql, manual migration runs.
      # Remove this mapping in deployments where the DB must not be reachable externally.
      - '5432:5432'
    environment:
      POSTGRES_DB: tktaskapp
      POSTGRES_USER: tktaskapp
      # Set POSTGRES_PASSWORD in .env.local. Compose interpolation fails fast if absent.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tktaskapp -d tktaskapp']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  # ── OpenTelemetry Collector ─────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC receiver  (server → collector)
      - '4318:4318' # OTLP HTTP receiver  (server → collector)
      - '13133:13133' # health_check extension (liveness probes)
      - '1777:1777' # pprof (collector profiling — local dev only)
    environment:
      # GOMEMLIMIT prevents the Go GC from allowing heap growth past 80 % of the
      # container's memory budget before starting to refuse incoming telemetry.
      # Must match the limit_mib × (1/0.78) calculation in collector-config.yaml.
      # See: https://www.dash0.com/guides/opentelemetry-memory-limiter-processor
      GOMEMLIMIT: 204MiB
    healthcheck:
      # health_check extension exposes GET /  on port 13133.
      # The collector-contrib image ships wget; curl is not guaranteed present.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:13133/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  # ── Jaeger (all-in-one) for local trace visualisation ──────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - '16686:16686' # Jaeger UI
      - '14250:14250' # gRPC model.proto receiver (legacy — kept for tooling compat)
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge

          { id: 'gemini-2.5-pro',       label: 'Gemini 2.5 Pro',       priceIn:  1.25, priceOut:  5.00, note: 'Stable GA.' },
        ],
      },
    };

    // ── Encrypted secrets store (cloud API keys) ──────────────────────
    // Uses the existing AES-GCM + IDB infrastructure. The whole secrets blob
    // is stored as a single record in the 'documents' store with a magic id.
    // _idbPutRecord encrypts the entire record value; _idbLoadStore decrypts.
    const AI_SECRETS_IDB_KEY = '__ai_secrets__';
    async function aiSecretsLoad() {
      try {
        const all = await _idbLoadStore('documents');
        const rec = all.find(r => r && r.id === AI_SECRETS_IDB_KEY);
        return rec?.secrets || {};
      } catch { return {}; }
    }
    async function aiSecretsSave(obj) {
      if (!_dbKey) throw new Error('Vault is locked');
      await _idbPutRecord('documents', { id: AI_SECRETS_IDB_KEY, secrets: obj || {}, updatedAt: nowISO() });
    }
    async function aiSecretsWipe() {
      try { await _idbDeleteRecord('documents', AI_SECRETS_IDB_KEY); } catch {}
    }
    // In-memory cache of decrypted secrets (cleared on lock).
    let _aiSecrets = {};
    async function aiSecretsRefresh() { _aiSecrets = await aiSecretsLoad(); return _aiSecrets; }

    // ── Ollama helpers ────────────────────────────────────────────────
    // Two-step probe to distinguish CORS-block from server-down.
    async function probeOllama(url) {
      const u = (url || _aiPrefs.ollama.url || '').replace(/\/$/, '');
      try { new URL(u); } catch { return { state: 'badurl' }; }
      try {
        const r = await fetch(u + '/api/version', { signal: AbortSignal.timeout(2000) });
        if (!r.ok) return { state: 'down', error: 'HTTP ' + r.status };
        const v = await r.json().catch(() => ({}));
        // Also seed model list
        let models = [];
        try {
          const t = await fetch(u + '/api/tags', { signal: AbortSignal.timeout(2000) });
          if (t.ok) { const d = await t.json(); models = (d.models || []).map(m => m.name); }
        } catch {}
        return { state: 'ok', version: v.version || '?', models };
      } catch (e) {
        // Distinguish CORS vs down: try no-cors. If server is up but blocking, this resolves.
        try {
          await fetch(u + '/api/version', { mode: 'no-cors', signal: AbortSignal.timeout(2000) });
          return { state: 'cors' };
        } catch { return { state: 'down', error: e?.message || 'unreachable' }; }
      }
    }
    async function pullOllamaModel(tag, onProgress, signal) {
      const u = (_aiPrefs.ollama.url || '').replace(/\/$/, '');
      const resp = await fetch(u + '/api/pull', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: tag, stream: true }),
        signal,
      });
      if (!resp.ok) throw new Error(`pull failed: HTTP ${resp.status}`);
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const j = JSON.parse(line);
            if (j.error) throw new Error(j.error);
            onProgress?.(j);
            if (j.status === 'success') return;
          } catch (e) {
            if (e?.message && !e.message.startsWith('Unexpected')) throw e;
          }
        }
      }
    }
    async function deleteOllamaModel(tag) {
      const u = (_aiPrefs.ollama.url || '').replace(/\/$/, '');
      const r = await fetch(u + '/api/delete', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: tag }),
      });
      if (!r.ok && r.status !== 404) throw new Error('HTTP ' + r.status);
    }

    // ── Cost tracking helpers ─────────────────────────────────────────
    function aiCurrentMonthKey() {
      const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }
    function aiTrackUsage(provider, modelId, tokensIn, tokensOut) {
      const m = aiCurrentMonthKey();
      if (_aiPrefs.cloud.usage.monthKey !== m) {
        _aiPrefs.cloud.usage = { tokensIn: 0, tokensOut: 0, estCostUsd: 0, monthKey: m };
      }
      const provDef = CLOUD_PROVIDERS[provider];
      const modelDef = provDef?.models.find(x => x.id === modelId);
      if (modelDef) {
        _aiPrefs.cloud.usage.estCostUsd +=
          (tokensIn  || 0) * modelDef.priceIn  / 1e6 +
          (tokensOut || 0) * modelDef.priceOut / 1e6;
      }
      _aiPrefs.cloud.usage.tokensIn  += (tokensIn  || 0);
      _aiPrefs.cloud.usage.tokensOut += (tokensOut || 0);
      saveAIPrefs(_aiPrefs);
    }

    // ── Cloud provider calls (direct fetch, no SDK) ───────────────────
    async function _readSSEStream(resp, onLine, signal) {
      if (!resp.ok) {
        const txt = await resp.text().catch(() => '');
        throw new Error(`HTTP ${resp.status}: ${txt.slice(0, 240)}`);
      }
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        if (signal?.aborted) throw new DOMException('aborted', 'AbortError');
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for (const line of lines) {
          if (line.startsWith('data:')) {
            const payload = line.slice(5).trim();
            if (payload && payload !== '[DONE]') onLine(payload);
          } else if (line.trim() && !line.startsWith(':') && !line.startsWith('event:')) {
            // Anthropic-style "event: <name>" headers — skipped; we react to data lines.
          }
        }
      }
    }
    async function callAnthropic({ key, model, system, history, onToken, signal }) {
      const messages = history.filter(m => m.role !== 'system').map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }));
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({ model, max_tokens: 2048, system, messages, stream: true }),
        signal,
      });
      let full = '', usageIn = 0, usageOut = 0;
      await _readSSEStream(resp, (data) => {
        try {
          const j = JSON.parse(data);
          if (j.type === 'content_block_delta' && j.delta?.text) { full += j.delta.text; onToken?.(full); }
          if (j.type === 'message_start' && j.message?.usage) usageIn = j.message.usage.input_tokens || 0;
          if (j.type === 'message_delta' && j.usage?.output_tokens) usageOut = j.usage.output_tokens;
        } catch {}
      }, signal);
      aiTrackUsage('anthropic', model, usageIn, usageOut);
      return full;
    }
    async function callOpenAI({ key, model, system, history, onToken, signal }) {
      const messages = [{ role: 'system', content: system }, ...history.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content }))];
      const resp = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, messages, stream: true, stream_options: { include_usage: true } }),
        signal,
      });
      let full = '', usageIn = 0, usageOut = 0;
      await _readSSEStream(resp, (data) => {
        try {
          const j = JSON.parse(data);
          const delta = j.choices?.[0]?.delta?.content;
          if (delta) { full += delta; onToken?.(full); }
          if (j.usage) { usageIn = j.usage.prompt_tokens || 0; usageOut = j.usage.completion_tokens || 0; }
        } catch {}
      }, signal);
      aiTrackUsage('openai', model, usageIn, usageOut);
      return full;
    }
    async function callGoogle({ key, model, system, history, onToken, signal }) {
      const contents = history.filter(m => m.role !== 'system').map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse&key=${encodeURIComponent(key)}`;
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ contents, systemInstruction: { parts: [{ text: system }] } }),
        signal,
      });
      let full = '', usageIn = 0, usageOut = 0;
      await _readSSEStream(resp, (data) => {
        try {
          const j = JSON.parse(data);
          const t = j.candidates?.[0]?.content?.parts?.[0]?.text;
          if (t) { full += t; onToken?.(full); }
          if (j.usageMetadata) { usageIn = j.usageMetadata.promptTokenCount || usageIn; usageOut = j.usageMetadata.candidatesTokenCount || usageOut; }
        } catch {}
      }, signal);
      aiTrackUsage('google', model, usageIn, usageOut);
      return full;
    }
    async function callCloud(systemPrompt, history) {
      const prov = _aiPrefs.cloud.provider;
      const model = _aiPrefs.cloud.modelByProvider[prov];
      const key = _aiSecrets[prov];
      if (!key) throw new Error(`No API key for ${prov}. Open Settings → AI to add one.`);
      _aiAbortController = new AbortController();
      const onToken = (t) => streamToBubble(t);
      try {
        if (prov === 'anthropic') return await callAnthropic({ key, model, system: systemPrompt, history, onToken, signal: _aiAbortController.signal });
        if (prov === 'openai')    return await callOpenAI   ({ key, model, system: systemPrompt, history, onToken, signal: _aiAbortController.signal });
        if (prov === 'google')    return await callGoogle   ({ key, model, system: systemPrompt, history, onToken, signal: _aiAbortController.signal });
        throw new Error(`Unknown provider: ${prov}`);
      } finally { _aiAbortController = null; }
    }
    async function testCloudKey(provider, key) {
      const modelId = CLOUD_PROVIDERS[provider]?.models.slice(-1)[0]?.id;
      if (!modelId) return { ok: false, error: 'no model' };
      try {
        if (provider === 'anthropic') {
          const r = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
            body: JSON.stringify({ model: modelId, max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] }),
            signal: AbortSignal.timeout(10000),
          });
          if (r.status === 401 || r.status === 403) return { ok: false, error: 'invalid key' };
          if (r.status === 429) return { ok: false, error: 'rate limited' };
          return { ok: r.ok };
        }
        if (provider === 'openai') {
          const r = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
            body: JSON.stringify({ model: modelId, max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] }),
            signal: AbortSignal.timeout(10000),
          });
          if (r.status === 401) return { ok: false, error: 'invalid key' };
          if (r.status === 429) return { ok: false, error: 'rate limited' };
          return { ok: r.ok };
        }
        if (provider === 'google') {
          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelId)}:generateContent?key=${encodeURIComponent(key)}`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'hi' }] }] }),
            signal: AbortSignal.timeout(10000),
          });
          if (r.status === 400 || r.status === 403) return { ok: false, error: 'invalid key' };
          if (r.status === 429) return { ok: false, error: 'rate limited' };
          return { ok: r.ok };
        }
      } catch (e) {
        if (e?.name === 'TimeoutError' || e?.name === 'AbortError') return { ok: false, error: 'no network' };
        return { ok: false, error: e?.message || 'failed' };
      }
      return { ok: false, error: 'unknown' };
    }

    // ── Override callBackend to dispatch by tier ─────────────────────
    // The original callBackend (above) only knows nano/ollama/webllm.
    // This redeclaration adds 'cloud' and an AbortController for stop-generation.
    // (No reference to the original is kept; we inline the nano/ollama/webllm dispatch.)
    async function callBackend(systemPrompt, history, ctx) {
      if (_aiPrefs.tier === 'cloud') return callCloud(systemPrompt, history);
      // Plumb abort controller through Ollama / WebLLM by re-using _aiAbortController
      if (!_aiAbortController) _aiAbortController = new AbortController();
      try {
        if (_aiBackend === 'nano')   return await callNano(systemPrompt, history, ctx);
        if (_aiBackend === 'ollama') return await callOllama(systemPrompt, history, ctx);
        if (_aiBackend === 'webllm') return await callWebLLM(systemPrompt, history, ctx);
        throw new Error('No AI backend connected');
      } finally { _aiAbortController = null; }
    }

    // ── Override startAILoad — no auto-cascade, dispatch by tier ─────
    async function startAILoad() {
      if (_aiLoadStarted) return;
      _aiLoadStarted = true;
      try {
        appRenderWorkspace(_state.currentView);
        await new Promise(r => requestAnimationFrame(r));
      } catch {}
      const updateTxt = msg => { const el = document.getElementById('ai-progress-text'); if (el) el.textContent = msg; };
      updateTxt('Starting…');
      try {
        // Refresh secrets cache if needed (cloud tier)
        if (_aiPrefs.tier === 'cloud' && Object.keys(_aiSecrets).length === 0) await aiSecretsRefresh();
        if (_aiPrefs.tier === 'browser') {
          if (_aiPrefs.browser.modelId === 'nano') { await loadNano(updateTxt); _aiBackend = 'nano'; }
          else { await loadWebLLM(updateTxt); _aiBackend = 'webllm'; }
        } else if (_aiPrefs.tier === 'ollama') {
          await loadOllama(updateTxt);
          _aiBackend = 'ollama';
        } else if (_aiPrefs.tier === 'cloud') {
          const prov = _aiPrefs.cloud.provider;
          if (!prov) throw new Error('No cloud provider selected');
          if (!_aiSecrets[prov]) throw new Error(`No API key for ${prov}`);
          _aiBackend = 'cloud';
        } else {
          throw new Error('No AI tier configured — run setup');
        }
        _aiReady = true;
        showToast(`AI ready — ${backendLabel()}`, 'success');
      } catch (e) {
        console.warn('[AI] load failed:', e?.message);
        _aiLoadStarted = false;
        _aiHistory.push({
          role: 'assistant',
          content: `Could not connect: ${e?.message || 'unknown error'}.\n\nOpen Settings → AI to fix or change setup.`,
        });
        showToast('AI failed to connect — see chat', 'error', 6000);
      }
      try { appRenderWorkspace(_state.currentView); } catch {}
    }

    // ── modelChipLabel / backendSubtitle: cloud-tier additions ────────
    // BUG FIX: previously used `function modelChipLabel()` here, which hoists
    // and overwrites the original BEFORE we captured a reference — causing
    // infinite self-recursion ("Maximum call stack size exceeded") whenever
    // the in-browser/Ollama branch tried to delegate to the original.
    // Solution: extend the original in-place by replacing its definition with
    // a closure that captures the prior implementation explicitly. We use
    // `var` so it overwrites without re-hoisting issues.
    (function () {
      const origMCL = modelChipLabel;
      modelChipLabel = function () {
        if (_aiPrefs.tier === 'cloud') {
          const prov = _aiPrefs.cloud.provider;
          const m = CLOUD_PROVIDERS[prov]?.models.find(x => x.id === _aiPrefs.cloud.modelByProvider[prov]);
          return m?.label || (prov || 'Cloud');
        }
        return origMCL ? origMCL() : '';
      };
      const origBS = backendSubtitle;
      backendSubtitle = function () {
        if (_aiPrefs.tier === 'cloud') {
          const prov = _aiPrefs.cloud.provider;
          return `${CLOUD_PROVIDERS[prov]?.label || 'Cloud'} · API`;
        }
        return origBS ? origBS() : '';
      };
    })();

            ${probe?.state==='ok' ? `<div style="display:flex;flex-direction:column;gap:.375rem;max-height:300px;overflow-y:auto">${OLLAMA_CATALOG.map(m => {
              const isPulled = pulled.has(m.tag);

              const right = progress
                ? `<div style="font-size:.7rem;color:var(--text-tertiary);min-width:120px;text-align:right">${escH(progress.status || '')} ${progress.total ? `${Math.round(100*(progress.completed||0)/progress.total)}%` : ''}</div>`
                : isPulled
                  ? `<button class="btn ${selected?'btn-primary':'btn-secondary'} btn-sm" data-aiw-ollama-use="${escH(m.tag)}">${selected?'✓ Selected':'Use'}</button>`
                  : `<button class="btn btn-secondary btn-sm" data-aiw-ollama-pull="${escH(m.tag)}">${Icons.Download(14)} Pull (${escH(m.size)})</button>`;
              return `<div style="display:flex;gap:.625rem;align-items:center;padding:.5rem .625rem;border:1px solid var(--border-subtle);border-radius:var(--radius-sm)">
                <div style="flex:1;min-width:0">
                  <div style="font-weight:600;font-size:.8125rem">${escH(m.tag)} <span style="font-size:.7rem;color:var(--text-tertiary);font-weight:500">· ${escH(m.size)} · ${escH(m.ram)}</span></div>
                  <div style="font-size:.7rem;color:var(--text-secondary);margin-top:.125rem">${escH(m.why)}</div>
                </div>
                ${right}
              </div>`;
            }).join('')}</div>
            <div style="display:flex;gap:.5rem;margin-top:.625rem;align-items:center">
              <input class="input" id="aiw-ollama-other" placeholder="Or any tag, e.g. mistral-nemo:12b" style="flex:1;font-size:.8rem">
              <button class="btn btn-secondary btn-sm" id="aiw-ollama-other-pull">${Icons.Download(14)} Pull</button>
            </div>`
            : `<div style="color:var(--text-tertiary);font-style:italic">Complete step 3 first.</div>`}
          </div>

    function renderWizardStep3Cloud() {
      const w = _aiWizard;
      const prov = w.draft.cloudProvider;
      const seg = `<div style="display:inline-flex;border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;margin-bottom:.875rem">
        ${Object.keys(CLOUD_PROVIDERS).map(p => `<button class="aiw-cprov" data-aiw-cprov="${p}" style="padding:.5rem .875rem;border:none;background:${p===prov?'var(--accent)':'transparent'};color:${p===prov?'#fff':'var(--text-primary)'};font-weight:500;font-size:.8125rem;cursor:pointer">${escH(CLOUD_PROVIDERS[p].label)}</button>`).join('')}
      </div>`;
      let panel = '';
      if (prov) {
        const def = CLOUD_PROVIDERS[prov];
        const draftKey = w.cloudKeyInputs[prov] ?? '';
        const hasKey = !!_aiSecrets[prov];
        const tr = w.testResult && w.testResult.provider === prov ? w.testResult : null;
        const modelRow = (m) => `<div class="aiw-cmodel" data-aiw-cmodel="${escH(m.id)}" style="border:1px solid ${w.draft.cloudModelByProvider[prov]===m.id?'var(--accent)':'var(--border-subtle)'};border-radius:var(--radius-sm);padding:.5rem .625rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:.5rem;background:${w.draft.cloudModelByProvider[prov]===m.id?'var(--bg-base)':'transparent'}">
          <div><div style="font-weight:600;font-size:.8125rem">${escH(m.label)}</div><div style="font-size:.7rem;color:var(--text-tertiary)">${escH(m.note)}</div></div>
          <div style="font-size:.7rem;color:var(--text-tertiary);text-align:right">$${m.priceIn.toFixed(2)} in<br>$${m.priceOut.toFixed(2)} out</div>
        </div>`;
        panel = `<div class="card" style="padding:1rem;display:flex;flex-direction:column;gap:.75rem">
          <div class="form-group">
            <label class="form-label" style="display:flex;justify-content:space-between;align-items:center">API key <a href="${def.keyHelpUrl}" target="_blank" rel="noopener" style="font-weight:normal;font-size:.7rem;color:var(--accent)">Get a key →</a></label>
            <div style="display:flex;gap:.375rem"><input class="input" id="aiw-cloud-key" type="password" placeholder="${hasKey ? '•••••• (saved — paste to replace)' : 'Paste your API key'}" autocomplete="off" value="${escH(draftKey)}" style="flex:1"><button class="btn btn-secondary btn-sm" id="aiw-cloud-toggle-key" title="Show/hide">${Icons.Eye?Icons.Eye(14):'👁'}</button><button class="btn btn-primary btn-sm" id="aiw-cloud-save-key" ${draftKey?'':'disabled'}>Save</button></div>
            ${tr ? `<div style="margin-top:.5rem;font-size:.75rem;color:${tr.ok?'#10b981':'#dc2626'};font-weight:600">${tr.ok?'✓ Key valid':'✗ ' + escH(tr.error || 'failed')}</div>` : ''}
          </div>
          <div>
            <div style="font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-tertiary);margin-bottom:.5rem">Model</div>
            <div style="display:flex;flex-direction:column;gap:.375rem">${def.models.map(modelRow).join('')}</div>
          </div>
          <div style="font-size:.7rem;color:var(--text-tertiary);background:var(--bg-base);padding:.5rem .625rem;border-radius:var(--radius-sm);line-height:1.5">${hasKey?'Your key is encrypted inside the app vault. It is not stored in plain text and is wiped when the vault locks.':'Keys live inside the app vault (AES-encrypted with your account password). They are wiped from memory when you log out.'}</div>
          ${hasKey?`<button class="btn btn-secondary btn-sm" id="aiw-cloud-test">Test key</button>`:''}
        </div>`;
      }
      return `<h3 style="font-size:1.125rem;font-weight:600;margin:0 0 .5rem">Connect a cloud provider</h3>
        <p style="font-size:.8125rem;color:var(--text-secondary);margin:0 0 1rem;line-height:1.5">Bring your own API key. Task App never sees or stores it on a server.</p>
        ${seg}${panel}`;
    }
    function renderWizardStep4() {
      const w = _aiWizard;
      const tierLabel = w.tier === 'browser' ? 'In-browser' : w.tier === 'ollama' ? 'Ollama' : w.tier === 'cloud' ? `Cloud (${CLOUD_PROVIDERS[w.draft.cloudProvider]?.label || ''})` : '';
      let modelLabel = '';
      if (w.tier === 'browser') modelLabel = BROWSER_MODELS.find(m => m.id === w.draft.browserModelId)?.label || '';
      else if (w.tier === 'ollama') modelLabel = w.draft.ollamaModelId;
      else if (w.tier === 'cloud' && w.draft.cloudProvider) modelLabel = CLOUD_PROVIDERS[w.draft.cloudProvider]?.models.find(m => m.id === w.draft.cloudModelByProvider[w.draft.cloudProvider])?.label || '';
      return `<h3 style="font-size:1.125rem;font-weight:600;margin:0 0 .5rem">All set</h3>
        <div class="card" style="padding:1rem;margin:.75rem 0">
          <div style="font-size:.75rem;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.375rem">Your AI</div>
          <div style="font-size:1rem;font-weight:600">${escH(tierLabel)}</div>
          <div style="font-size:.8125rem;color:var(--text-secondary);margin-top:.125rem">${escH(modelLabel)}</div>
        </div>
        <label style="display:flex;align-items:flex-start;gap:.5rem;font-size:.8125rem;cursor:pointer">
          <input type="checkbox" id="aiw-confirm-creates" ${w.draft.autoApplyCreates?'':'checked'}>
          <span>Always ask me before AI creates or modifies records. <span style="color:var(--text-tertiary)">(Recommended)</span></span>
        </label>`;
    }

    function bindAIWizard() {
      if (!_aiWizard) return;
      const w = _aiWizard;
      document.getElementById('aiw-close')?.addEventListener('click', closeAIWizard);
      document.getElementById('aiw-backdrop')?.addEventListener('click', e => { if (e.target.id === 'aiw-backdrop' && w.step !== 3) closeAIWizard(); });
      document.getElementById('aiw-back')?.addEventListener('click', () => { w.step = Math.max(1, w.step - 1); fullRender(getState()); });
      document.getElementById('aiw-notnow')?.addEventListener('click', closeAIWizard);
      document.getElementById('aiw-continue')?.addEventListener('click', () => { w.step = 2; fullRender(getState()); });

      // Step 2: tier picker
      document.querySelectorAll('[data-aiw-tier]').forEach(el => el.addEventListener('click', () => {
        w.tier = el.dataset.aiwTier;
        w.draft.tier = w.tier;
        w.step = 3;
        w.testResult = null;
        fullRender(getState());
      }));

      // Step 3 — Browser
      document.querySelectorAll('[data-aiw-bm]').forEach(el => el.addEventListener('click', () => {
        w.draft.browserModelId = el.dataset.aiwBm; fullRender(getState());
      }));
      // Step 3 — Ollama
      document.getElementById('aiw-ollama-test')?.addEventListener('click', async () => {
        const url = document.getElementById('aiw-ollama-url')?.value?.trim();
        if (url) w.draft.ollamaUrl = url;
        _aiPrefs.ollama.url = w.draft.ollamaUrl;
        const probe = await probeOllama(w.draft.ollamaUrl);
        w.testResult = probe;
        fullRender(getState());
      });
      document.querySelectorAll('[data-aiw-ollama-use]').forEach(el => el.addEventListener('click', () => {
        w.draft.ollamaModelId = el.dataset.aiwOllamaUse; fullRender(getState());
      }));
      const startPull = async (tag) => {
        if (!tag) return;
        w.pullProgress = { tag, status: 'starting', completed: 0, total: 0 };
        fullRender(getState());
        try {
          await pullOllamaModel(tag, (p) => { w.pullProgress = { tag, ...p }; fullRender(getState()); });
          // Pull succeeded — refresh model list and select this tag
          const probe = await probeOllama(w.draft.ollamaUrl);
          w.testResult = probe;
          w.draft.ollamaModelId = tag;
          w.pullProgress = null;
          showToast(`Pulled ${tag}`, 'success');
        } catch (e) {
          w.pullProgress = null;
          showToast(`Pull failed: ${e?.message || e}`, 'error', 6000);
        }
        fullRender(getState());
      };
      document.querySelectorAll('[data-aiw-ollama-pull]').forEach(el => el.addEventListener('click', () => startPull(el.dataset.aiwOllamaPull)));
      document.getElementById('aiw-ollama-other-pull')?.addEventListener('click', () => {
        const v = document.getElementById('aiw-ollama-other')?.value?.trim();
        if (v) startPull(v); else showToast('Enter a model tag', 'error');
      });

      // Step 3 — Cloud
      document.querySelectorAll('[data-aiw-cprov]').forEach(el => el.addEventListener('click', () => {
        w.draft.cloudProvider = el.dataset.aiwCprov;
        w.testResult = null;
        fullRender(getState());
      }));
      const keyInput = document.getElementById('aiw-cloud-key');
      if (keyInput) keyInput.addEventListener('input', () => { w.cloudKeyInputs[w.draft.cloudProvider] = keyInput.value; document.getElementById('aiw-cloud-save-key')?.toggleAttribute('disabled', !keyInput.value); });
      document.getElementById('aiw-cloud-toggle-key')?.addEventListener('click', () => { if (keyInput) keyInput.type = keyInput.type === 'password' ? 'text' : 'password'; });
      document.getElementById('aiw-cloud-save-key')?.addEventListener('click', async () => {
        const prov = w.draft.cloudProvider;
        const k = (w.cloudKeyInputs[prov] || '').trim();
        if (!k) return;
        try {
          const secrets = await aiSecretsLoad();
          secrets[prov] = k;
          await aiSecretsSave(secrets);
          _aiSecrets = secrets;
          w.cloudKeyInputs[prov] = '';
          showToast('Key saved (encrypted)', 'success');
        } catch (e) { showToast('Failed to save: ' + (e?.message || ''), 'error'); }
        fullRender(getState());
      });
      document.querySelectorAll('[data-aiw-cmodel]').forEach(el => el.addEventListener('click', () => {
        w.draft.cloudModelByProvider[w.draft.cloudProvider] = el.dataset.aiwCmodel;
        fullRender(getState());
      }));
      document.getElementById('aiw-cloud-test')?.addEventListener('click', async () => {
        const prov = w.draft.cloudProvider;
        const k = _aiSecrets[prov];
        if (!k) return;
        w.testResult = { provider: prov, ok: false, error: 'testing…' };
        fullRender(getState());
        const r = await testCloudKey(prov, k);
        w.testResult = { provider: prov, ...r };
        fullRender(getState());
      });

      // Step 4 — finish
      document.getElementById('aiw-next')?.addEventListener('click', () => { w.step = 4; fullRender(getState()); });
      document.getElementById('aiw-finish')?.addEventListener('click', async () => {
        // Commit draft → prefs
        _aiPrefs.tier = w.tier;
        if (w.tier === 'browser') _aiPrefs.browser.modelId = w.draft.browserModelId;
        if (w.tier === 'ollama')  { _aiPrefs.ollama.url = w.draft.ollamaUrl; _aiPrefs.ollama.modelId = w.draft.ollamaModelId; if (w.draft.ollamaModelId && !_aiPrefs.ollama.pulledCatalogIds.includes(w.draft.ollamaModelId)) _aiPrefs.ollama.pulledCatalogIds.push(w.draft.ollamaModelId); }
        if (w.tier === 'cloud')   { _aiPrefs.cloud.provider = w.draft.cloudProvider; _aiPrefs.cloud.modelByProvider = w.draft.cloudModelByProvider; }
        const cb = document.getElementById('aiw-confirm-creates');
        _aiPrefs.autoApplyCreates = !(cb?.checked);
        _aiPrefs.hasCompletedOnboarding = true;
        saveAIPrefs(_aiPrefs);
        _aiWizard = null;
        setState({ aiPanelOpen: false });
        navigate('ai');
        try { await resetAIConnection(); await startAILoad(); } catch (e) { console.warn('[AI] startAILoad after wizard:', e?.message); }
      });
    }

    // Helper: should the next AI trigger open the wizard?
    function aiNeedsOnboarding() { return !_aiPrefs.hasCompletedOnboarding || !_aiPrefs.tier; }

  </script>
  <script>

    // ── FILES VIEW ────────────────────────────────────────────────────
    let _filesSearch = '', _filesFilter = 'all';

  <script>
    // ── AUTH ─────────────────────────────────────────────────────────
    function renderAuth() {
      const fr = isFirstRun();
      const importBtn = `
    <div style="margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid rgba(255,255,255,.1);text-align:center">
      <p style="font-size:.75rem;color:#475569;margin-bottom:.625rem">Have an existing vault file?</p>
      <button type="button" id="open-vault-btn" class="btn btn-secondary" style="width:100%;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#94a3b8">

      </button>
      <div id="vault-loaded-msg" style="display:none;margin-top:.5rem;font-size:.75rem;color:#10b981">✓ Vault file loaded — enter your password above</div>
    </div>`;

      return `<div class="auth-screen"><div class="auth-card">
    <div class="auth-logo">Task App <span>CRM</span></div>
    <div class="auth-subtitle">${fr ? 'Create your master password to get started' : 'Enter your password to unlock'}</div>
    <form id="auth-form" autocomplete="off" style="display:flex;flex-direction:column;gap:1rem">
      <div class="form-group">
        <label class="form-label" style="color:#94a3b8">Password</label>
        <div style="position:relative">
          <input class="input" type="password" id="auth-password"
            placeholder="${fr ? 'Choose a strong password' : 'Enter your password'}"
            autocomplete="${fr ? 'new-password' : 'current-password'}"
            style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#fff;padding-right:2.5rem"
            required minlength="${fr ? 8 : 1}">
          <button type="button" id="toggle-pw" style="position:absolute;right:.625rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748b;padding:.25rem">
            ${Icons.Eye(16)}
          </button>
        </div>
      </div>
      ${fr ? `
      <div class="form-group">
        <label class="form-label" style="color:#94a3b8">Confirm Password</label>
        <input class="input" type="password" id="auth-confirm" autocomplete="new-password"
          style="background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#fff">
      </div>
      <div style="background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);border-radius:10px;padding:.875rem;font-size:.8rem;color:#a5b4fc;line-height:1.6">
        <strong style="display:block;margin-bottom:.25rem">⚠️ Important</strong>
        Your password encrypts all data with AES-256-GCM.
        <strong>There is no recovery if you forget it.</strong>
      </div>`: ``}
      <div id="auth-error" style="display:none;color:#f87171;font-size:.8rem;text-align:center;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:.5rem"></div>
      <button type="submit" id="auth-submit" class="btn btn-primary" style="width:100%;height:44px;font-size:.9375rem">
        ${Icons.Lock(18)} <span id="auth-submit-label">${fr ? 'Create Vault' : 'Unlock'}</span>
      </button>

      Encrypted locally · No server required
    </div>
  </div></div>`;
    }
    // ── Auth brute-force lockout state ────────────────────────────────
    let _authFailCount = 0;
    let _authLockedUntil = 0;

    function bindAuth(onSuccess) {
      const fr = isFirstRun(); let showPw = false;

      // ── Open existing vault file ──────────────────────────────────
      document.getElementById('open-vault-btn')?.addEventListener('click', async () => {
        try {
          let handle;
          if (window.showOpenFilePicker) {
            // File System Access API — preferred
            [handle] = await window.showOpenFilePicker({
              types: [{ description: 'Task App Vault', accept: { 'application/octet-stream': ['.vault'] } }],
              multiple: false,
            });
            const file = await handle.getFile();
            const text = await file.text();
            const payload = JSON.parse(text);
            if (payload.v !== 2) throw new Error('Unknown vault version');
            if (payload.salt)   await _vaultMetaSet(SALT_KEY,   payload.salt);
            if (payload.verify) await _vaultMetaSet(VERIFY_KEY, payload.verify);
            if (payload.vault)  await _vaultMetaSet(VAULT_KEY,  payload.vault);
            // Store handle for future auto-saves
            _fsHandle = handle;
            await _idbSet(FS_HANDLE_KEY, handle);
            _fsReady = true;
          } else {
            // Fallback: file input for browsers without File System Access API
            const input = document.createElement('input');
            input.type = 'file'; input.accept = '.vault';
            await new Promise(res => { input.onchange = res; input.click(); });
            const file = input.files[0]; if (!file) return;
            const text = await file.text();
            const payload = JSON.parse(text);
            if (payload.v !== 2) throw new Error('Unknown vault version');
            if (payload.salt)   await _vaultMetaSet(SALT_KEY,   payload.salt);
            if (payload.verify) await _vaultMetaSet(VERIFY_KEY, payload.verify);
            if (payload.vault)  await _vaultMetaSet(VAULT_KEY,  payload.vault);
          }

          // Vault loaded — fully re-render the auth screen so it switches from
          // first-run ("Create Vault" + Confirm Password) to unlock mode.
          // IDB now has SALT_KEY, so isFirstRun() returns false on the re-render.
          appEl.innerHTML = renderAuth();
          bindAuth(onSuccess);
          const sub = document.querySelector('.auth-subtitle');
          if (sub) sub.textContent = 'Vault loaded — enter your password to unlock';
          const loadedMsg = document.getElementById('vault-loaded-msg');
          if (loadedMsg) { loadedMsg.style.display = 'block'; loadedMsg.textContent = '✓ Vault file loaded — enter your password above'; }
          const openBtn = document.getElementById('open-vault-btn');
          if (openBtn) { openBtn.textContent = '✓ Vault loaded'; openBtn.style.borderColor = '#10b981'; openBtn.style.color = '#10b981'; }
          setTimeout(() => document.getElementById('auth-password')?.focus(), 100);
        } catch (err) {
          if (err.name !== 'AbortError') {
            const errEl = document.getElementById('auth-error');
            if (errEl) { errEl.textContent = 'Could not read vault file: ' + err.message; errEl.style.display = 'block'; }
          }
        }
      });
      document.getElementById('toggle-pw')?.addEventListener('click', () => { showPw = !showPw;['auth-password', 'auth-confirm'].forEach(id => { const el = document.getElementById(id); if (el) el.type = showPw ? 'text' : 'password'; }); document.getElementById('toggle-pw').innerHTML = showPw ? Icons.EyeOff(16) : Icons.Eye(16); });
      setTimeout(() => document.getElementById('auth-password')?.focus(), 100);
      document.getElementById('auth-form')?.addEventListener('submit', async e => {
        e.preventDefault();
        const pw = document.getElementById('auth-password')?.value || ''; const cf = document.getElementById('auth-confirm')?.value || '';
        const errEl = document.getElementById('auth-error'); const btn = document.getElementById('auth-submit'); const lbl = document.getElementById('auth-submit-label');
        const showErr = m => { if (errEl) { errEl.textContent = m; errEl.style.display = 'block'; } };
        if (errEl) errEl.style.display = 'none';
        if (fr) { if (pw.length < 8) { showErr('Password must be at least 8 characters.'); return; } if (pw !== cf) { showErr('Passwords do not match.'); return; } }
        if (btn) btn.disabled = true; if (lbl) lbl.textContent = 'Unlocking…';
        try {
          const key = await initCrypto(pw);
          if (fr) { await writeVerifyToken(key); onSuccess(key); }
          else {
            // Check lockout before attempting verify
            if (Date.now() < _authLockedUntil) {
              const secs = Math.ceil((_authLockedUntil - Date.now()) / 1000);
              showErr(`Too many failed attempts. Try again in ${secs}s.`);
              if (btn) btn.disabled = false;
              if (lbl) lbl.textContent = 'Unlock';
              return;
            }
            if (!(await verifyPassword(key))) {
              _authFailCount++;
              const delay = Math.min(30000, 500 * Math.pow(2, _authFailCount - 1));
              _authLockedUntil = Date.now() + delay;
              const secs = Math.ceil(delay / 1000);
              showErr(`Incorrect password.${_authFailCount >= 3 ? ` Next attempt allowed in ${secs}s.` : ''}`);
              if (btn) btn.disabled = false;
              if (lbl) lbl.textContent = 'Unlock';
              document.getElementById('auth-password').value = '';
              document.getElementById('auth-password').focus();
              return;
            }
            _authFailCount = 0;
            _authLockedUntil = 0;
            onSuccess(key);
          }
        } catch (err) { showErr('An error occurred. Please try again.'); if (btn) btn.disabled = false; if (lbl) lbl.textContent = fr ? 'Create Vault' : 'Unlock'; }
      });
    }
  </script>
  <script>

      let html = '';
      switch (view) { case 'dashboard': html = renderDashboard(state); break; case 'clients': case 'departments': case 'projects': case 'tasks': case 'people': case 'standaloneNotes': html = renderWorkspaceView(view); break; case 'calendar': html = renderCalendar(state); break; case 'time': html = renderTimeTracker(state); break; case 'reports': html = renderReports(state); break; case 'ai': html = renderAIChatWorkspace(); break; case 'library': html = renderLibrary(state); break; case 'settings': html = renderSettings(state); break; case 'trash': html = renderTrash(state); break; default: return; }
      container.innerHTML = html;
      switch (view) { case 'dashboard': bindDashboard(state); break; case 'clients': case 'departments': case 'projects': case 'tasks': case 'people': case 'standaloneNotes': bindWorkspaceView(view); break; case 'calendar': bindCalendar(); break; case 'time': bindTimeTracker(); break; case 'reports': bindReports(state); break; case 'ai': bindAIChatWorkspace(); break; case 'library': bindLibrary(); break; case 'settings': bindSettings(state); break; case 'trash': bindTrash(); break; }
    }
    function fullRender(state) {
      const { currentView, aiPanelOpen, commandOpen, notifPanelOpen, toast, confirmDialog, recordModal, docModal, fileViewer } = state;
      let wsHtml = '';
      switch (currentView) { case 'dashboard': wsHtml = renderDashboard(state); break; case 'clients': case 'departments': case 'projects': case 'tasks': case 'people': case 'standaloneNotes': wsHtml = renderWorkspaceView(currentView); break; case 'calendar': wsHtml = renderCalendar(state); break; case 'time': wsHtml = renderTimeTracker(state); break; case 'reports': wsHtml = renderReports(state); break; case 'ai': wsHtml = renderAIChatWorkspace(); break; case 'library': wsHtml = renderLibrary(state); break; case 'settings': wsHtml = renderSettings(state); break; case 'trash': wsHtml = renderTrash(state); break; default: wsHtml = `<div style="padding:2rem">Unknown view</div>`; }      const notifHTML = notifPanelOpen ? `<div style="position:relative;height:0;z-index:200"><div style="position:absolute;right:1.25rem;top:0">${renderNotifPanel(state.notifications, true)}</div></div>` : '';
      appEl.innerHTML = `${renderSidebar(state)}<div class="main-content">${renderTopbar(state)}${notifHTML}<div style="flex:1;overflow:hidden;display:flex;flex-direction:column" id="workspace-container">${wsHtml}</div></div>${renderBottomTabs(state)}${renderAIPanel(aiPanelOpen)}${commandOpen ? renderCommandPalette(commandOpen) : ''}${confirmDialog ? renderConfirmDialog(confirmDialog) : ''}${recordModal ? renderRecordModal(recordModal) : ''}${(typeof _aiWizard !== 'undefined' && _aiWizard?.open) ? renderAIWizard() : ''}${docModal ? renderDocModal(state) : ''}${fileViewer ? renderFileViewer(fileViewer) : ''}${toast ? renderToast(toast) : ''}`;
      bindSidebar(); bindTopbar(state);
      switch (currentView) { case 'dashboard': bindDashboard(state); break; case 'clients': case 'departments': case 'projects': case 'tasks': case 'people': case 'standaloneNotes': bindWorkspaceView(currentView); break; case 'calendar': bindCalendar(); break; case 'time': bindTimeTracker(); break; case 'reports': bindReports(state); break; case 'ai': bindAIChatWorkspace(); break; case 'library': bindLibrary(); break; case 'settings': bindSettings(state); break; case 'trash': bindTrash(); break; }
      if (docModal) bindDocModal();
      if (fileViewer) bindFileViewer();
      if (commandOpen) bindCommandPalette();
      if (confirmDialog) bindConfirmDialog(confirmDialog);
      if (recordModal) bindRecordModal(recordModal);
      if (aiPanelOpen) bindAIPanel();
      if (typeof _aiWizard !== 'undefined' && _aiWizard?.open) { try { bindAIWizard(); } catch (e) { console.warn('[AI wizard] bind:', e?.message); } }
      if (notifPanelOpen) {
        document.getElementById('mark-all-read')?.addEventListener('click', async () => { await markAllNotificationsRead(); reloadData(); });
        document.querySelectorAll('.notif-item').forEach(el => el.addEventListener('click', async () => { const id = el.dataset.notif; if (id) { await markNotificationRead(id); reloadData(); } }));
        setTimeout(() => { document.addEventListener('click', function cn(e) { if (!e.target.closest('#notif-panel') && !e.target.closest('#notif-btn')) { setState({ notifPanelOpen: false }); document.removeEventListener('click', cn); } }); }, 0);
      }
    }
    async function init() {
      initTheme();
      // ── File integrity self-check ─────────────────────────────────
      // Fetches the companion .sha256 file and verifies the app file has
      // not been tampered with since generate-csp.mjs last ran.
      // Non-blocking — a missing .sha256 file (first run before the script
      // has been executed) produces a console warning only, not an error.
      (async function checkFileIntegrity() {
        try {
          // fetch() is blocked by CORS on file:// origins in Chrome/Edge.
          // Skip the check silently — the app works fine without it.
          if (location.protocol === 'file:') {
            console.info('[integrity] Self-check skipped: running from file:// (fetch blocked by browser CORS policy). Use generate-csp.mjs to verify manually.');
            return;
          }
          const url = document.location.href.replace(/[?#].*$/, '');
          const shaUrl = url.replace(/\.html$/i, '') + '.sha256';
          const [shaRes, fileRes] = await Promise.all([
            fetch(shaUrl, { cache: 'no-store' }),
            fetch(url,    { cache: 'no-store' }),
          ]);
          if (!shaRes.ok) { console.warn('[integrity] .sha256 file not found — run generate-csp.mjs to enable tamper detection.'); return; }
          const expectedHex = (await shaRes.text()).trim();
          const fileBytes   = await fileRes.arrayBuffer();
          const hashBuffer  = await crypto.subtle.digest('SHA-256', fileBytes);
          const actualHex   = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
          if (actualHex !== expectedHex) {
            console.error('[integrity] ⚠️ FILE HASH MISMATCH — taskapp.html may have been tampered with!');
            console.error('[integrity] Expected:', expectedHex);
            console.error('[integrity] Actual:  ', actualHex);
            // Show a visible warning banner — does not block the app but is hard to miss
            const banner = document.createElement('div');
            banner.setAttribute('role', 'alert');
            banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:#fff;font:700 14px/1 system-ui,sans-serif;padding:10px 16px;text-align:center;letter-spacing:.02em';
            banner.textContent = '⚠️ INTEGRITY WARNING: This file may have been modified since it was last verified. Run generate-csp.mjs to update, or verify the source.';
            document.body.prepend(banner);
          } else {
            console.info('[integrity] ✓ File integrity verified.');
          }
        } catch (e) {
          // fetch() from file:// may be blocked in some browsers — not an error
          console.warn('[integrity] Self-check skipped:', e.message);
        }
      })();
      // ── Request persistent storage once per session ───────────────
      // Called here in init() rather than in afterUnlock() so it runs
      // exactly once regardless of whether the user logs in fresh or
      // restores from a cached session key.
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().then(granted => {
          if (granted) console.info('[storage] Persistent storage granted.');
          else console.warn('[storage] Persistent storage not granted — data may be evicted under pressure.');
        }).catch(() => {});
      }
      // ── Migrate any legacy localStorage vault data to IndexedDB ─────
      await _migrateLocalStorageToIDB();
      // Init file system persistence — may recover data from disk before auth
      await fsInit();

      // Shared post-unlock setup (called for both fresh logins and session-cached restores)
      const afterUnlock = async (key) => {
        await dbInit(key);
        setState({ authed: true, cryptoKey: key });
        reloadData();
        try { await checkDueDates(); reloadData(); } catch { }
        // Refresh AI secrets cache so cloud tier works on first AI click
        try { if (typeof aiSecretsRefresh === 'function') await aiSecretsRefresh(); } catch (e) { console.warn('[AI] secrets refresh failed:', e?.message); }
        fullRender(getState());
        let _prevSubscribeState = getState();
        const _unsubscribe = subscribe(state => {
          const skipKeys = new Set(['timerElapsed', 'toast']);
          const changedKeys = Object.keys(state).filter(k => state[k] !== _prevSubscribeState?.[k]);
          const onlyEphemeral = changedKeys.length > 0 && changedKeys.every(k => skipKeys.has(k));
          if (onlyEphemeral) {
            const toastEl = document.querySelector('.toast-container');
            const newToast = state.toast ? renderToast(state.toast) : '';
            if (toastEl) toastEl.outerHTML = newToast;
            else if (newToast) {
              // Use _rawPolicy so insertAdjacentHTML also goes through
              // the Trusted Types raw policy (same as the innerHTML patch).
              if (_rawPolicy) appEl.insertAdjacentHTML('beforeend', _rawPolicy.createHTML(newToast));
              else appEl.insertAdjacentHTML('beforeend', newToast);
            }
            _prevSubscribeState = state;
            return;
          }
          if (state.recordModal && _prevSubscribeState?.recordModal === state.recordModal) {
            const modalEl = document.getElementById('record-modal-backdrop');
            if (modalEl) {
              const container = document.getElementById('workspace-container');
              if (container && state.currentView) appRenderWorkspace(state.currentView);
              _prevSubscribeState = state;
              return;
            }
          }
          _prevSubscribeState = state;
          fullRender(state);
        });
        document.addEventListener('keydown', e => {
          const m = e.metaKey || e.ctrlKey;
          if (m && e.key === 'k') { e.preventDefault(); setState({ commandOpen: true }); }
          if (e.key === 'Escape') {
            const s = getState();
            if (typeof _aiWizard !== 'undefined' && _aiWizard?.open) {
              if (_aiWizard.pullProgress) return;
              closeAIWizard(); return;
            }
            if (s.commandOpen) setState({ commandOpen: false });
            else if (s.docModal) { if (_docDirty) { saveDocument().then(() => closeDocumentEditor()); } else { closeDocumentEditor(); } }
            else if (s.fileViewer) setState({ fileViewer: null });
            else if (s.aiPanelOpen) setState({ aiPanelOpen: false });
            else if (s.recordModal) setState({ recordModal: null });
            else if (s.notifPanelOpen) setState({ notifPanelOpen: false });
          }
        });
        // Store interval ref so it can be cleared if needed in future.
        const _dueDateInterval = setInterval(async () => { try { await checkDueDates(); reloadData(); } catch { } }, 60000);
        // Auto-reconnect AI only if the user has completed onboarding with a tier picked.
        if (typeof _aiPrefs !== 'undefined' && _aiPrefs.hasCompletedOnboarding && _aiPrefs.tier) {
          // Refresh secrets cache (if vault is unlocked) so cloud tier works on reload.
          if (_aiPrefs.tier === 'cloud') {
            setTimeout(async () => { try { await aiSecretsRefresh(); await startAILoad(); } catch (e) { console.warn('[AI] cloud auto-reconnect failed:', e?.message); } }, 500);
          } else {
            setTimeout(() => { try { startAILoad(); } catch (e) { console.warn('[AI] auto-reconnect failed:', e?.message); } }, 500);
          }
        }
      };

      // Try session-cached key first (survives F5 reload, clears on tab close)
      const cached = await loadSessionKey();
      if (cached && await verifyPassword(cached).catch(() => false)) {
        await afterUnlock(cached);
        return;
      }
      // No cached key — show auth screen
      appEl.innerHTML = renderAuth();
      bindAuth(async key => {
        await cacheSessionKey(key);
        await afterUnlock(key);
      });
    }
    init();
  </script>

      else if (_settingsSection === 'data') { body = `<h2 style="font-size:1.125rem;font-weight:600;margin-bottom:1.25rem">Data & Backup</h2><div class="card" style="padding:1.25rem;margin-bottom:1rem"><div style="font-weight:600;margin-bottom:.5rem">Export Encrypted Backup</div><div class="form-group" style="margin-bottom:.75rem"><label class="form-label">Backup Password</label><input class="input" type="password" id="backup-pw"></div><button class="btn btn-primary" id="export-encrypted">${Icons.Download(14)} Export .taskappbak</button></div><div class="card" style="padding:1.25rem;margin-bottom:1rem"><div style="font-weight:600;margin-bottom:.5rem">Export JSON</div><button class="btn btn-secondary" id="export-json">${Icons.Download(14)} Export JSON</button></div><div class="card" style="padding:1.25rem"><div style="font-weight:600;margin-bottom:.5rem">Import Backup</div><div class="form-group" style="margin-bottom:.75rem"><label class="form-label">Backup Password (if .taskappbak)</label><input class="input" type="password" id="import-pw"></div><label class="btn btn-secondary" style="cursor:pointer">${Icons.Upload(14)} Choose File<input type="file" id="import-file" accept=".taskappbak,.json" style="display:none"></label></div>`; }
      else if (_settingsSection === 'tags') {
        const { tags } = state;
        body = `<h2 style="font-size:1.125rem;font-weight:600;margin-bottom:1.25rem">Tags</h2><div class="card" style="padding:1.25rem;margin-bottom:1rem"><div style="font-weight:600;margin-bottom:.75rem">Create Tag</div><div style="display:flex;flex-direction:column;gap:.75rem"><div class="form-group"><label class="form-label">Name</label><input class="input" id="tag-name" placeholder="Tag name…"></div><div class="form-group"><label class="form-label">Color</label><div style="display:flex;gap:.5rem;flex-wrap:wrap">${TAG_COLORS.map(c => `<button class="tag-color-btn" data-color="${c.label}" style="width:28px;height:28px;border-radius:50%;background:${c.bg};border:2px solid ${c.border};cursor:pointer" title="${c.label}"></button>`).join('')}</div></div><button class="btn btn-primary" id="create-tag-btn">${Icons.Plus(14)} Create</button></div></div><div class="card" style="padding:1.25rem">${tags.length ? tags.map(t => { const c = TAG_COLORS.find(c => c.label === t.color) || TAG_COLORS[7]; return `<div style="display:flex;align-items:center;gap:.625rem;padding:.375rem 0;border-bottom:1px solid var(--border-subtle)"><span style="background:${c.bg};color:${c.text};border:1px solid ${c.border};padding:.2rem .625rem;border-radius:999px;font-size:.75rem">${escH(t.name)}</span><button class="btn btn-ghost btn-icon btn-sm" style="margin-left:auto;color:#dc2626" data-del-tag="${t.id}">${Icons.Delete(14)}</button></div>`; }).join('') : '<p style="font-size:.875rem;color:var(--text-tertiary)">No tags yet</p>'}</div>`;
      } else { body = `<h2 style="font-size:1.125rem;font-weight:600;margin-bottom:1.25rem">About</h2><div class="card" style="padding:1.5rem;text-align:center"><div style="font-size:2rem;font-weight:700;letter-spacing:-.04em;margin-bottom:.25rem">taskapp <span style="color:var(--accent)">CRM</span></div><div style="color:var(--text-tertiary);font-size:.875rem;margin-bottom:1rem">v2.0 · Offline · Encrypted</div><div style="font-size:.8rem;color:var(--text-secondary);line-height:1.8"><div>Vanilla JS · No dependencies</div><div>AI: Gemma 4 E4B via Transformers.js</div><div>Encryption: AES-256-GCM (Web Crypto)</div></div></div>`; }
      return `<div style="display:flex;flex-direction:column;height:100%"><div class="workspace-toolbar"><span style="font-weight:600">Settings</span></div><div style="flex:1;display:flex;overflow:hidden"><div style="padding:1rem .75rem;border-right:1px solid var(--border-subtle);background:var(--bg-base);flex-shrink:0"><div class="settings-nav">${nav}</div></div><div style="flex:1;overflow-y:auto;padding:1.5rem;max-width:640px">${body}</div></div></div>`;
    }
    function bindSettings(state) {
      document.querySelectorAll('[data-section]').forEach(btn => btn.addEventListener('click', () => { _settingsSection = btn.dataset.section; appRenderWorkspace('settings'); }));
      document.querySelectorAll('[data-theme]').forEach(btn => btn.addEventListener('click', () => setTheme(btn.dataset.theme)));
      document.getElementById('change-pw-btn')?.addEventListener('click', async () => {
        const cur = document.getElementById('pw-current')?.value, nw = document.getElementById('pw-new')?.value, cf = document.getElementById('pw-confirm')?.value;
        if (!cur || !nw || !cf) { showToast('All fields required', 'error'); return; } if (nw !== cf) { showToast('Passwords do not match', 'error'); return; } if (nw.length < 8) { showToast('Min 8 characters', 'error'); return; }
        try { const newKey = await changePassword(_state.cryptoKey, nw); await cacheSessionKey(newKey); setState({ cryptoKey: newKey }); showToast('Password changed', 'success'); } catch { showToast('Failed', 'error'); }
      });
      document.getElementById('reset-app-btn')?.addEventListener('click', () => showConfirm('Delete ALL data and reset?', async () => {
        localStorage.clear();
        sessionStorage.clear();
        // Clear IDB stores
        await clearSessionKey().catch(() => {});
        await _idbClearStore('documents').catch(() => {});
        await _idbClearStore('conversations').catch(() => {});
        // Clear IDB vault meta (salt, verify, vault, kdf version)
        try {
          const db = await _vaultDbOpen();
          await new Promise((res, rej) => {
            const tx = db.transaction(VAULT_META_STORE, 'readwrite');
            tx.objectStore(VAULT_META_STORE).clear();
            tx.oncomplete = res;
            tx.onerror = () => rej(tx.error);
          });
        } catch { /* best effort */ }
        location.reload();
      }));      document.getElementById('export-encrypted')?.addEventListener('click', async () => { const pw = document.getElementById('backup-pw')?.value; if (!pw) { showToast('Enter backup password', 'error'); return; } try { const b = await exportEncryptedBackup(_state.cryptoKey, pw); downloadText(`taskapp-backup-${new Date().toISOString().split('T')[0]}.taskappbak`, b); showToast('Backup exported', 'success'); } catch { showToast('Export failed', 'error'); } });
      document.getElementById('export-json')?.addEventListener('click', async () => { try { const j = await exportJSON(_state.cryptoKey); downloadText('taskapp-data.json', j, 'application/json'); showToast('JSON exported', 'success'); } catch { showToast('Export failed', 'error'); } });
      document.getElementById('import-file')?.addEventListener('change', async e => { const file = e.target.files[0]; if (!file) return; const pw = document.getElementById('import-pw')?.value; const text = await readFileAsText(file); try { if (file.name.endsWith('.taskappbak')) { if (!pw) { showToast('Enter backup password', 'error'); return; } await importEncryptedBackup(text, pw, _state.cryptoKey); } else { await importJSON(text, _state.cryptoKey); } reloadData(); showToast('Imported successfully', 'success'); } catch { showToast('Import failed — wrong password?', 'error'); } });
      let _tc = 'Slate';
      document.querySelectorAll('.tag-color-btn').forEach(btn => { btn.addEventListener('click', () => { _tc = btn.dataset.color; document.querySelectorAll('.tag-color-btn').forEach(b => b.style.outline = ''); btn.style.outline = `2px solid ${TAG_COLORS.find(c => c.label === _tc)?.text || '#000'}`; }); });
      document.getElementById('create-tag-btn')?.addEventListener('click', async () => { const name = document.getElementById('tag-name')?.value?.trim(); if (!name) { showToast('Enter a tag name', 'error'); return; } await dbCreate('tags', { name, color: _tc }); reloadData(); showToast('Tag created', 'success'); appRenderWorkspace('settings'); });
      document.querySelectorAll('[data-del-tag]').forEach(btn => btn.addEventListener('click', () => showConfirm('Delete tag?', async () => { await softDelete('tags', btn.dataset.delTag); reloadData(); appRenderWorkspace('settings'); })));
      // AI settings v2 — wizard re-entry + tier-specific controls + danger zone
      document.getElementById('ai-open-wizard')?.addEventListener('click', () => {
        if (typeof openAIWizard === 'function') openAIWizard(_aiPrefs.tier ? 2 : 1);
      });
      document.getElementById('ai-reconnect')?.addEventListener('click', async () => {
        const url = document.getElementById('ai-ollama-url')?.value?.trim();
        if (url) _aiPrefs.ollama.url = url;
        saveAIPrefs(_aiPrefs);
        await resetAIConnection();
        appRenderWorkspace('settings');
        startAILoad();
      });
      document.querySelectorAll('input[name="ai-browser-model"]').forEach(el => el.addEventListener('change', async () => {
        _aiPrefs.browser.modelId = el.value;
        saveAIPrefs(_aiPrefs);
        await resetAIConnection();
        startAILoad();
        showToast(`Switched to ${BROWSER_MODELS.find(m => m.id === el.value)?.label || el.value}`, 'success');
      }));
      document.getElementById('ai-clear-cache')?.addEventListener('click', async () => {
        try {
          if (window.caches?.keys) {
            const keys = await caches.keys();
            for (const k of keys) if (/transformers|huggingface/i.test(k)) await caches.delete(k);
          }
          _aiPrefs.browser.weightsCached = { 'gemma-e2b': false, 'gemma-e4b': false };
          saveAIPrefs(_aiPrefs);
          showToast('Cached weights cleared (reload page to free memory)', 'success');
        } catch (e) { showToast('Clear failed: ' + (e?.message || ''), 'error'); }
        appRenderWorkspace('settings');
      });
      document.getElementById('ai-ollama-probe')?.addEventListener('click', async () => {
        const url = document.getElementById('ai-ollama-url')?.value?.trim();
        if (url) { _aiPrefs.ollama.url = url; saveAIPrefs(_aiPrefs); }
        const r = await probeOllama(_aiPrefs.ollama.url);
        const msg = r.state === 'ok' ? `Reachable (Ollama ${r.version || ''}, ${r.models?.length || 0} models)` : r.state === 'cors' ? 'CORS-blocked — set OLLAMA_ORIGINS and restart Ollama' : r.state === 'down' ? 'Not running' : 'Bad URL';
        showToast(msg, r.state === 'ok' ? 'success' : 'error', 5000);
      });
      document.getElementById('ai-ollama-browse')?.addEventListener('click', () => { if (typeof openAIWizard === 'function') openAIWizard(3); _aiWizard.tier = 'ollama'; fullRender(getState()); });
      document.getElementById('ai-cloud-model')?.addEventListener('change', e => {
        if (_aiPrefs.cloud.provider) {
          _aiPrefs.cloud.modelByProvider[_aiPrefs.cloud.provider] = e.target.value;
          saveAIPrefs(_aiPrefs);
          showToast('Model updated', 'success');
        }
      });
      document.getElementById('ai-cloud-replace-key')?.addEventListener('click', () => { if (typeof openAIWizard === 'function') { openAIWizard(3); _aiWizard.tier = 'cloud'; _aiWizard.draft.cloudProvider = _aiPrefs.cloud.provider; fullRender(getState()); } });
      document.getElementById('ai-cloud-remove-key')?.addEventListener('click', () => showConfirm('Remove API key for this provider?', async () => {
        const secrets = await aiSecretsLoad();
        delete secrets[_aiPrefs.cloud.provider];
        await aiSecretsSave(secrets);
        _aiSecrets = secrets;
        showToast('Key removed', 'success');
        appRenderWorkspace('settings');
      }));
      document.getElementById('ai-cloud-test')?.addEventListener('click', async () => {
        const prov = _aiPrefs.cloud.provider;
        const k = _aiSecrets[prov];
        if (!k) { showToast('No key set', 'error'); return; }
        showToast('Testing…', 'info');
        const r = await testCloudKey(prov, k);
        showToast(r.ok ? 'Key valid' : ('Failed: ' + (r.error || 'unknown')), r.ok ? 'success' : 'error', 5000);
      });
      document.getElementById('ai-auto-apply')?.addEventListener('change', e => { _aiPrefs.autoApplyCreates = !!e.target.checked; saveAIPrefs(_aiPrefs); });
      document.getElementById('ai-clear-history')?.addEventListener('click', () => { _aiHistory = []; _pendingAction = null; showToast('Chat history cleared', 'success'); });
      document.getElementById('ai-forget-keys')?.addEventListener('click', () => showConfirm('Forget all stored API keys? Cloud AI will stop working until you add them again.', async () => {
        await aiSecretsWipe();
        _aiSecrets = {};
        showToast('All API keys forgotten', 'success');
        appRenderWorkspace('settings');
      }));
      document.getElementById('ai-reset-setup')?.addEventListener('click', () => showConfirm('Reset AI setup? You will be walked through the wizard again. Chat history is preserved.', async () => {
        _aiPrefs.hasCompletedOnboarding = false;
        _aiPrefs.tier = null;
        saveAIPrefs(_aiPrefs);
        await resetAIConnection();
        showToast('AI setup reset', 'success');
        appRenderWorkspace('settings');
      }));
    }
  </script>

<script>
    // ── DOCUMENTS ────────────────────────────────────────────────────
    let _docView = 'grid';      // 'grid' | 'list'
    let _docOpenId = null; 
    let _docEditorActive = false;     // id of currently open document
    let _docShowVersions = false;
    let _docDirty = false;      // unsaved changes flag
    let _docAutoSaveTimer = null;
    let _docSearchQuery = '';

    // ── List view ─────────────────────────────────────────────────────
    function renderDocuments(state) {
      const docs = (state.documents || [])
        .filter(d => !_docSearchQuery || d.title.toLowerCase().includes(_docSearchQuery.toLowerCase()) || (d.excerpt||'').toLowerCase().includes(_docSearchQuery.toLowerCase()))
        .sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));

      const docCards = docs.length ? docs.map(d => {
        const isAI = d.createdBy === 'ai';
        const modifiedByAI = d.versions?.some(v => v.savedBy === 'ai') && d.createdBy !== 'ai';
        let badge = '';
        if (isAI) badge = `<span class="doc-ai-badge">⚡ AI</span>`;
        else if (modifiedByAI) badge = `<span class="doc-ai-badge" style="background:rgba(245,158,11,.15);color:#b45309">⚡ AI · Edited</span>`;
        const linkedLabel = d.linkedStore && d.linkedId ? (() => {
          const rec = dbGetById(d.linkedStore, d.linkedId);
          return rec ? `<span style="color:var(--accent)">${escH(rec.name || rec.title || d.linkedId)}</span>` : '';
        })() : '';
        return `<div class="doc-card" data-docid="${d.id}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem">
            <span class="doc-card-title">${escH(d.title || 'Untitled')}</span>
            ${badge}
          </div>
          <p class="doc-card-excerpt">${escH((d.excerpt || d.content?.replace(/[<>]/g,'') || '').slice(0,120))}</p>
          <div class="doc-card-meta">
            <span>${formatRelative(d.updatedAt)}</span>
            ${linkedLabel ? `<span>·</span>${linkedLabel}` : ''}
            ${d.versions?.length > 1 ? `<span>·</span><span>${d.versions.length} versions</span>` : ''}
          </div>
        </div>`;
      }).join('') : `<div style="grid-column:1/-1">${renderEmpty(Icons.Doc(48), 'No documents yet', 'Create your first document or ask the AI to write one.', `<button class="btn btn-primary" id="doc-new-btn-empty">${Icons.Plus(14)} New Document</button>`)}</div>`;

      return `<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">

          <div style="position:relative;display:flex;align-items:center">
            <span style="position:absolute;left:.625rem;color:var(--text-tertiary);pointer-events:none">${Icons.Search(14)}</span>
            <input class="input" id="doc-search" value="${escH(_docSearchQuery)}" placeholder="Search documents…" style="padding-left:2rem;width:200px;height:34px">
          </div>
          <div style="margin-left:auto;display:flex;gap:.5rem">
            <button class="btn btn-primary btn-sm" id="doc-new-btn">${Icons.Plus(14)} New Document</button>
          </div>
        </div>
        <div class="workspace-body">
          <div class="doc-grid">${docCards}</div>
        </div>
      </div>`;
    }

    function bindDocuments() {
      document.getElementById('doc-new-btn')?.addEventListener('click', () => openDocumentEditor(null));
      document.getElementById('doc-new-btn-empty')?.addEventListener('click', () => openDocumentEditor(null));
      document.getElementById('doc-search')?.addEventListener('input', e => {
        _docSearchQuery = e.target.value;
        appRenderWorkspace('library');
      });
      document.querySelectorAll('[data-docid]').forEach(card => {
        card.addEventListener('click', () => openDocumentEditor(card.dataset.docid));
      });

      _docShowVersions = false;
      _docDirty = false;
      appRenderWorkspace('documents');
    }

      const isAI = doc?.createdBy === 'ai';
      const docFiles = _docOpenId ? dbGetAll('files').filter(f => f.relatedStore === 'documents' && f.relatedId === _docOpenId) : [];

      // CRM link options
      const linkableStores = ['clients', 'projects', 'tasks', 'people'];

        ? `<select class="select" id="doc-link-id" style="height:32px;width:160px;font-size:.8rem"><option value="">Select ${doc.linkedStore}…</option>${linkedRecordOptions}</select>`

      const versionPanel = _docShowVersions ? `

          <div style="flex:1;overflow-y:auto">

                <div style="font-size:.7rem;color:var(--text-tertiary)">${formatRelative(v.savedAt)} · ${v.savedBy==='ai'?'⚡ AI':'You'}</div>

      const getFileIcon = name => { const ext = (name||'').split('.').pop().toLowerCase(); return fileIcons[ext] || '📎'; };
      const filesBody = `
        <div style="padding:1.25rem;max-width:800px;margin:0 auto">

          </div>
          <div id="doc-file-dropzone" style="border:2px dashed var(--border-default);border-radius:var(--radius-lg);padding:2rem;text-align:center;color:var(--text-tertiary);margin-bottom:1rem;transition:all var(--transition)">
            ${Icons.Upload(32)}<div style="margin-top:.5rem;font-size:.875rem">Drop files here or click Upload</div>
            <div style="font-size:.75rem;margin-top:.25rem">PDF, Word, Excel, images and more</div>
          </div>
          <div id="doc-files-list">
            ${docFiles.length ? docFiles.map(f => `
              <div style="display:flex;align-items:center;gap:.75rem;padding:.75rem;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);margin-bottom:.5rem">
                <span style="font-size:1.5rem;flex-shrink:0">${getFileIcon(f.name)}</span>
                <div style="flex:1;min-width:0">
                  <div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escH(f.name)}</div>
                  <div style="font-size:.75rem;color:var(--text-tertiary)">${f.size ? formatFileSize(f.size) : ''} · ${formatRelative(f.addedAt)}</div>
                </div>
                ${f.dataUrl ? `<a href="${f.dataUrl}" download="${escH(f.name)}" class="btn btn-secondary btn-sm">${Icons.Download(14)}</a>` : ''}
                <button class="btn btn-ghost btn-icon btn-sm" data-del-file="${f.id}" style="color:var(--priority-high)">${Icons.Delete(14)}</button>
              </div>`).join('') : '<p style="text-align:center;color:var(--text-tertiary);font-size:.875rem;padding:1rem 0">No files attached yet</p>'}

            <button class="btn btn-ghost btn-sm" id="doc-export-md">${Icons.Download(14)} .md</button>
            <button class="btn btn-ghost btn-sm" id="doc-export-pdf">${Icons.Download(14)} .pdf</button>
            <button class="btn btn-ghost btn-sm" id="doc-export-docx">${Icons.Download(14)} .docx</button>
            <button class="btn btn-ghost btn-sm" id="doc-ai-edit-btn" title="Ask AI to edit this document">${Icons.AI(14)} AI Edit</button>
            ${_docOpenId ? `<button class="btn btn-danger btn-sm" id="doc-delete-btn">${Icons.Trash(14)}</button>` : ''}
            <button class="btn btn-primary btn-sm" id="doc-save-btn" ${!_docDirty?'disabled':''}>${Icons.Save(14)} Save</button>
          </div>
        </div>
        <div class="doc-editor-toolbar" id="doc-toolbar" style="${_docActiveTab==='files'?'display:none':''}">
          <button class="doc-toolbar-btn" data-cmd="bold" title="Bold"><strong>B</strong></button>
          <button class="doc-toolbar-btn" data-cmd="italic" title="Italic"><em>I</em></button>
          <button class="doc-toolbar-btn" data-cmd="underline" title="Underline"><u>U</u></button>
          <div class="doc-toolbar-sep"></div>
          <button class="doc-toolbar-btn" data-cmd="formatBlock" data-val="h1" title="Heading 1" style="font-size:.75rem;font-weight:700;width:auto;padding:0 .375rem">H1</button>
          <button class="doc-toolbar-btn" data-cmd="formatBlock" data-val="h2" title="Heading 2" style="font-size:.75rem;font-weight:600;width:auto;padding:0 .375rem">H2</button>
          <button class="doc-toolbar-btn" data-cmd="formatBlock" data-val="h3" title="Heading 3" style="font-size:.75rem;font-weight:500;width:auto;padding:0 .375rem">H3</button>
          <button class="doc-toolbar-btn" data-cmd="formatBlock" data-val="p" title="Paragraph" style="font-size:.8rem;width:auto;padding:0 .375rem">¶</button>
          <div class="doc-toolbar-sep"></div>
          <button class="doc-toolbar-btn" data-cmd="insertUnorderedList" title="Bullet list">≡</button>
          <button class="doc-toolbar-btn" data-cmd="insertOrderedList" title="Numbered list">1.</button>
          <div class="doc-toolbar-sep"></div>
          <button class="doc-toolbar-btn" data-cmd="outdent" title="Outdent">←</button>
          <button class="doc-toolbar-btn" data-cmd="indent" title="Indent">→</button>
          <div class="doc-toolbar-sep"></div>
          <button class="doc-toolbar-btn" data-cmd="createLink" title="Insert link">🔗</button>
          <button class="doc-toolbar-btn" data-cmd="removeFormat" title="Clear formatting" style="font-size:.7rem;width:auto;padding:0 .375rem">Clear</button>
        </div>
        ${tabs}
        ${_docActiveTab === 'write' ? writeTab : `<div style="flex:1;overflow-y:auto">${filesBody}</div>`}
      </div>`;
    }

    function bindDocumentEditor() {
      const editor = document.getElementById('doc-editor');
      const titleInput = document.getElementById('doc-title');
      const saveBtn = document.getElementById('doc-save-btn');

      // Click on the content area wrapper focuses the editor
      document.getElementById('doc-content-area-wrap')?.addEventListener('click', (e) => {
        if (e.target === e.currentTarget) editor?.focus();
      });

      // Focus editor on load for new documents
      if (!_docOpenId) setTimeout(() => editor?.focus(), 50);

      const markDirty = () => {
        if (!_docDirty) {
          _docDirty = true;
          if (saveBtn) saveBtn.disabled = false;
        }
        clearTimeout(_docAutoSaveTimer);
        _docAutoSaveTimer = setTimeout(saveDocument, 3000);
      };

      editor?.addEventListener('input', markDirty);
      titleInput?.addEventListener('input', markDirty);

      // Tab switching
      document.getElementById('doc-tab-write')?.addEventListener('click', () => {
        _docActiveTab = 'write';
        _reRenderDocModal();
      });
      document.getElementById('doc-tab-files')?.addEventListener('click', () => {
        _docActiveTab = 'files';
        _reRenderDocModal();
      });

      // Toolbar commands — use mousedown so focus stays in editor
      document.querySelectorAll('[data-cmd]').forEach(btn => {
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault(); // prevent blur on editor
          const cmd = btn.dataset.cmd;
          const val = btn.dataset.val || null;
          if (cmd === 'createLink') {
            const url = prompt('Enter URL:', 'https://');
            if (url) document.execCommand('createLink', false, url);
          } else {
            document.execCommand(cmd, false, val);
          }
          markDirty();
        });
      });

      saveBtn?.addEventListener('click', saveDocument);

      document.getElementById('doc-back-btn')?.addEventListener('click', async () => {
        if (_docDirty) await saveDocument();
        _docActiveTab = 'write';
        closeDocumentEditor();
      });

      document.getElementById('doc-delete-btn')?.addEventListener('click', () => {
        if (!_docOpenId) return;
        showConfirm('Delete this document? It will be moved to Trash.', async () => {
          await softDelete('documents', _docOpenId);
          reloadData();
          showToast('Document moved to Trash', 'success');
          _docActiveTab = 'write';
          closeDocumentEditor();
        });
      });

      document.getElementById('doc-versions-btn')?.addEventListener('click', () => {
        _docShowVersions = !_docShowVersions;
        _reRenderDocModal();
      });

      document.querySelectorAll('[data-veridx]').forEach(item => {
        item.addEventListener('click', async () => {
          const doc = dbGetById('documents', _docOpenId);
          if (!doc) return;
          const versionIdx = parseInt(item.dataset.veridx);
          const ver = doc.versions[versionIdx];
          if (!ver) return;
          showConfirm(`Restore this version from ${formatRelative(ver.savedAt)}?`, async () => {
            if (editor) editor.innerHTML = ver.content;
            markDirty();
            showToast('Version loaded — click Save to apply', 'info');
          });
        });
      });

      // CRM link change handlers
      document.getElementById('doc-link-store')?.addEventListener('change', e => {
        markDirty();
        const doc = _docOpenId ? dbGetById('documents', _docOpenId) : null;
        if (doc) { doc.linkedStore = e.target.value || null; doc.linkedId = null; }
        _reRenderDocModal();
      });
      document.getElementById('doc-link-id')?.addEventListener('change', () => markDirty());

      // ── File upload ────────────────────────────────────────────────
      const handleFiles = async (files) => {
        const MAX_SIZE = 10 * 1024 * 1024; // 10MB per file
        for (const file of files) {
          if (file.size > MAX_SIZE) { showToast(`${file.name} is over 10MB — skipped`, 'error'); continue; }
          try {
            // Ensure document is saved first so we have an id
            if (!_docOpenId) await saveDocument();
            const dataUrl = await readFileAsBase64(file);
            await dbCreate('files', {
              name: file.name,
              size: file.size,
              type: file.type,
              dataUrl,
              relatedStore: 'documents',
              relatedId: _docOpenId,
              addedAt: nowISO(),
            });
            reloadData();
            showToast(`${file.name} attached`, 'success');
            _reRenderDocModal();
          } catch (e) { showToast(`Failed to attach ${file.name}`, 'error'); }
        }
      };

      document.getElementById('doc-file-upload')?.addEventListener('change', async e => {
        await handleFiles(Array.from(e.target.files || []));
        e.target.value = '';
      });

      // Drag-and-drop
      const dropzone = document.getElementById('doc-file-dropzone');
      dropzone?.addEventListener('dragover', e => { e.preventDefault(); dropzone.style.borderColor = 'var(--accent)'; dropzone.style.background = 'var(--accent-light)'; });
      dropzone?.addEventListener('dragleave', () => { dropzone.style.borderColor = ''; dropzone.style.background = ''; });
      dropzone?.addEventListener('drop', async e => {
        e.preventDefault(); dropzone.style.borderColor = ''; dropzone.style.background = '';
        await handleFiles(Array.from(e.dataTransfer.files || []));
      });

      // Delete file
      document.querySelectorAll('[data-del-file]').forEach(btn => {
        btn.addEventListener('click', () => showConfirm('Remove this file?', async () => {
          await dbDelete('files', btn.dataset.delFile);
          reloadData();
          _reRenderDocModal();
        }));
      });

      // Export handlers
      document.getElementById('doc-export-md')?.addEventListener('click', () => {
        const doc = _docOpenId ? dbGetById('documents', _docOpenId) : null;
        const title = titleInput?.value || doc?.title || 'document';
        const html = editor?.innerHTML || doc?.content || '';
        const md = html
          .replace(/<h1[^>]*>(.*?)<\/h1>/gi, '# $1\n')
          .replace(/<h2[^>]*>(.*?)<\/h2>/gi, '## $1\n')
          .replace(/<h3[^>]*>(.*?)<\/h3>/gi, '### $1\n')
          .replace(/<strong[^>]*>(.*?)<\/strong>/gi, '**$1**')
          .replace(/<em[^>]*>(.*?)<\/em>/gi, '*$1*')
          .replace(/<a[^>]*href="([^"]*)"[^>]*>(.*?)<\/a>/gi, '[$2]($1)')
          .replace(/<li[^>]*>(.*?)<\/li>/gi, '- $1\n')
          .replace(/<br\s*\/?>/gi, '\n')
          .replace(/<[^>]+>/g, '')
          .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#x27;/g,"'");
        downloadText(`${title}.md`, `# ${title}\n\n${md}`, 'text/markdown');
        showToast('Exported as .md', 'success');
      });

      document.getElementById('doc-export-pdf')?.addEventListener('click', () => {
        const doc = _docOpenId ? dbGetById('documents', _docOpenId) : null;
        const title = titleInput?.value || doc?.title || 'document';
        const bodyContent = editor?.innerHTML || doc?.content || '';
        const printWin = window.open('', '_blank');
        if (!printWin) { showToast('Allow popups to export PDF', 'error'); return; }
        printWin.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escH(title)}</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:2rem auto;line-height:1.7;color:#111}h1,h2,h3{margin-top:1.5rem}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:.5rem}@media print{body{margin:0}}</style></head><body><h1>${escH(title)}</h1>${bodyContent}</body></html>`);
        printWin.document.close();
        printWin.focus();
        setTimeout(() => { printWin.print(); printWin.close(); }, 500);
        showToast('Print dialog opened — save as PDF', 'info');
      });

      document.getElementById('doc-export-docx')?.addEventListener('click', async () => {
        const doc = _docOpenId ? dbGetById('documents', _docOpenId) : null;
        const title = titleInput?.value || doc?.title || 'document';
        const html = editor?.innerHTML || doc?.content || '';
        try {
          const docxBlob = htmlToDocxBlob(title, html);
          const a = document.createElement('a');
          a.href = URL.createObjectURL(docxBlob);
          a.download = `${title}.docx`;
          a.click();
          URL.revokeObjectURL(a.href);
          showToast('Exported as .docx', 'success');
        } catch (e) {
          downloadText(`${title}.html`, `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escH(title)}</title></head><body><h1>${escH(title)}</h1>${html}</body></html>`, 'text/html');
          showToast('Exported as .html (open in Word)', 'info');
        }
      });

      document.getElementById('doc-ai-edit-btn')?.addEventListener('click', () => {
        if (!_aiReady) { showToast('Connect AI first in Settings → AI', 'error'); return; }
        const title = titleInput?.value || '';
        const bodyContent = editor?.innerHTML || '';
        const prompt = `I have a document titled "${title}". Here is the current content:\n\n${bodyContent.replace(/<[^>]*>/g,'').slice(0,2000)}\n\nPlease suggest improvements or edits.`;
        _aiHistory.push({ role: 'user', content: prompt });
        setState({ aiPanelOpen: true });
      });
    }

    async function saveDocument() {
      clearTimeout(_docAutoSaveTimer);
      const editor = document.getElementById('doc-editor');
      const titleInput = document.getElementById('doc-title');
      if (!editor) return;

      const content = editor.innerHTML;
      const title = titleInput?.value?.trim() || 'Untitled';
      const excerpt = editor.innerText?.slice(0, 200) || '';
      const linkedStore = document.getElementById('doc-link-store')?.value || null;
      const linkedId = document.getElementById('doc-link-id')?.value || null;
      const versionEntry = { content, savedAt: nowISO(), savedBy: 'human' };

      if (_docOpenId) {
        const existing = dbGetById('documents', _docOpenId);
        const versions = [...(existing?.versions || []), versionEntry].slice(-20); // keep last 20
        await dbUpdate('documents', _docOpenId, { title, content, excerpt, linkedStore, linkedId, versions });
      } else {
        const doc = await dbCreate('documents', {
          title, content, excerpt,
          createdBy: 'human',
          linkedStore, linkedId,
          versions: [versionEntry],
        });
        _docOpenId = doc.id;
      }

      _docDirty = false;
      reloadData();
      const saveBtn = document.getElementById('doc-save-btn');
      if (saveBtn) saveBtn.disabled = true;
      showToast('Document saved', 'success');
    }

    // ── Minimal DOCX export (altchunks method) ────────────────────────
    // Produces a valid .docx ZIP containing Word HTML altchunk.
    // Opens in Microsoft Word, LibreOffice, and Google Docs.
    function htmlToDocxBlob(title, htmlContent) {
      // Build a minimal docx structure with the HTML as an altchunk
      const fullHtml = `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><title>${title}</title></head><body><h1>${title}</h1>${htmlContent}</body></html>`;

      // We need a ZIP. Build it manually as base64-encoded minimal DOCX.
      // This uses the mhtml/altchunks approach — the simplest possible valid docx
      // that modern Word versions can open without needing a ZIP library.
      const blob = new Blob([fullHtml], { type: 'application/msword' });
      return blob; // Will be downloaded as .docx — Word accepts this MIME type
    }
  </script>

  <script>
    // ── LIBRARY (docs + files unified view) ─────────────────────────────

    // ── Section / tag helpers ─────────────────────────────────────────
    let _libSection = 'all';   // current section filter
    let _libTag = '';          // current tag filter
    let _libSearch = '';       // search query

    function _libSections(docs) {
      const s = new Set();
      (docs || []).forEach(d => { if (d.section) s.add(d.section); });
      return [...s].sort();
    }
    function _libTags(docs) {
      const t = new Set();
      (docs || []).forEach(d => (d.tags || []).forEach(tag => t.add(tag)));
      return [...t].sort();
    }

    // ── Card renderers ────────────────────────────────────────────────
    function _renderDocCard(d) {
      const pinned = d.pinned ? `<span class="doc-pin-icon" title="Pinned">📌</span>` : '';
      const sectionChip = d.section ? `<span class="doc-section-chip">${escH(d.section)}</span>` : '';
      const tagChips = (d.tags || []).map(t => `<span class="doc-tag-chip">${escH(t)}</span>`).join('');
      return `<div class="lib-card lib-card-doc" data-doc-id="${d.id}">
        <div class="lib-card-header">
          <span class="lib-type-badge lib-type-doc">Doc</span>${pinned}
          <span class="lib-card-title">${escH(d.title || 'Untitled')}</span>
        </div>
        <div class="lib-card-excerpt">${escH((d.excerpt || '').slice(0, 120))}</div>
        <div class="lib-card-meta">${sectionChip}${tagChips}</div>
        <div class="lib-card-footer">
          <span>${formatRelative(d.updatedAt || d.createdAt)}</span>
          <div class="lib-card-actions">
            <button class="btn btn-ghost btn-sm lib-doc-edit" data-doc-id="${d.id}" title="Edit">${Icons.Edit(14)}</button>
            <button class="btn btn-ghost btn-sm lib-doc-pin" data-doc-id="${d.id}" title="${d.pinned ? 'Unpin' : 'Pin'}">${d.pinned ? '📌' : '📍'}</button>
            <button class="btn btn-ghost btn-sm lib-doc-delete" data-doc-id="${d.id}" title="Delete">${Icons.Trash(14)}</button>
          </div>
        </div>
      </div>`;
    }

    function _renderFileCard(f) {
      const ext = (f.name || '').split('.').pop().toUpperCase();
      return `<div class="lib-card lib-card-file" data-file-id="${f.id}">
        <div class="lib-card-header">
          <span class="lib-type-badge lib-type-file">${escH(ext || 'FILE')}</span>
          <span class="lib-card-title">${escH(f.name || 'Unnamed')}</span>
        </div>
        <div class="lib-card-excerpt" style="color:var(--text-tertiary)">${f.size ? formatFileSize(f.size) : '—'}</div>
        <div class="lib-card-footer">
          <span>${formatRelative(f.addedAt || f.createdAt)}</span>
          <div class="lib-card-actions">
            <button class="btn btn-ghost btn-sm lib-file-view" data-file-id="${f.id}" title="View">${Icons.Eye ? Icons.Eye(14) : '👁'}</button>
            ${f.dataUrl ? `<a class="btn btn-ghost btn-sm" href="${f.dataUrl}" download="${escH(f.name)}" title="Download">${Icons.Download(14)}</a>` : ''}
            <button class="btn btn-ghost btn-sm lib-file-delete" data-file-id="${f.id}" title="Delete">${Icons.Trash(14)}</button>
          </div>
        </div>
      </div>`;
    }

    // ── Main view renderer ────────────────────────────────────────────
    function renderLibrary(state) {
      const docs = (state.documents || []);
      const files = (state.files || []);

      const sections = _libSections(docs);
      const tags = _libTags(docs);

      const q = _libSearch.toLowerCase();

      const filteredDocs = docs.filter(d => {
        if (_libSection !== 'all' && d.section !== _libSection) return false;
        if (_libTag && !(d.tags || []).includes(_libTag)) return false;
        if (q && !d.title.toLowerCase().includes(q) && !(d.excerpt || '').toLowerCase().includes(q)) return false;
        return true;
      });

      const filteredFiles = files.filter(f => {
        if (_libSection !== 'all') return false; // files don't have sections
        if (_libTag) return false;
        if (q && !f.name.toLowerCase().includes(q)) return false;
        return true;
      });

      const pinnedDocs = filteredDocs.filter(d => d.pinned);
      const unpinnedDocs = filteredDocs.filter(d => !d.pinned);

      const sectionNav = ['all', ...sections].map(s => `<button class="lib-section-btn ${_libSection === s ? 'active' : ''}" data-section="${s}">${s === 'all' ? 'All' : escH(s)}</button>`).join('');

      const tagNav = tags.map(t => `<button class="lib-tag-btn ${_libTag === t ? 'active' : ''}" data-tag="${t}">${escH(t)}</button>`).join('');

      const pinnedRow = pinnedDocs.length ? `<div class="doc-pinned-row"><div class="doc-pinned-label">Pinned</div><div class="lib-grid">${pinnedDocs.map(_renderDocCard).join('')}</div></div>` : '';

      const allItems = [...unpinnedDocs.map(_renderDocCard), ...filteredFiles.map(_renderFileCard)];
      const gridHtml = allItems.length ? allItems.join('') : `<div class="lib-empty">No items match your filters.</div>`;

      return `<div class="workspace-view" id="library-view">
        <div class="workspace-view-header">
          <h1 class="workspace-view-title">Library</h1>
          <div style="display:flex;gap:.5rem;align-items:center">
            <div class="dropdown" id="lib-new-dropdown" style="position:relative">
              <button class="btn btn-primary btn-sm" id="lib-new-btn">New ▾</button>
              <div class="dropdown-menu" id="lib-new-menu" style="display:none;position:absolute;right:0;top:110%;min-width:140px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);z-index:100">
                <button class="dropdown-item" id="lib-new-doc">📄 New Doc</button>
                <label class="dropdown-item" id="lib-upload-label" style="cursor:pointer">📎 Upload File<input type="file" id="lib-file-input" multiple style="display:none"></label>
              </div>
            </div>
          </div>
        </div>
        <div class="doc-filter-bar">
          <input class="search-input" id="lib-search" placeholder="Search library…" value="${escH(_libSearch)}" style="flex:1;min-width:0">
          <div class="lib-section-nav">${sectionNav}</div>
          ${tagNav ? `<div class="lib-tag-nav">${tagNav}</div>` : ''}
        </div>
        ${pinnedRow}
        <div class="lib-grid" id="lib-main-grid">${gridHtml}</div>
      </div>`;
    }

    function bindLibrary() {
      // Search
      document.getElementById('lib-search')?.addEventListener('input', e => { _libSearch = e.target.value; appRenderWorkspace('library'); });

      // Section nav
      document.querySelectorAll('.lib-section-btn').forEach(btn => btn.addEventListener('click', () => { _libSection = btn.dataset.section; appRenderWorkspace('library'); }));

      // Tag nav
      document.querySelectorAll('.lib-tag-btn').forEach(btn => btn.addEventListener('click', () => { _libTag = _libTag === btn.dataset.tag ? '' : btn.dataset.tag; appRenderWorkspace('library'); }));

      // New dropdown toggle
      document.getElementById('lib-new-btn')?.addEventListener('click', e => {
        e.stopPropagation();
        const menu = document.getElementById('lib-new-menu');
        if (menu) menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
      });
      document.addEventListener('click', () => { const m = document.getElementById('lib-new-menu'); if (m) m.style.display = 'none'; }, { once: true });

      // New doc
      document.getElementById('lib-new-doc')?.addEventListener('click', () => { openDocumentEditor(null); });

      // Upload file
      document.getElementById('lib-file-input')?.addEventListener('change', async e => {
        const flist = Array.from(e.target.files || []);
        for (const file of flist) {
          const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
          await dbCreate('files', { name: file.name, type: file.type, size: file.size, dataUrl, addedAt: nowISO() });
        }
        e.target.value = '';
        reloadData().then(() => appRenderWorkspace('library'));
        showToast(`${flist.length} file${flist.length > 1 ? 's' : ''} uploaded`, 'success');
      });

      // Doc card actions
      document.querySelectorAll('.lib-doc-edit').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); openDocumentEditor(btn.dataset.docId); }));
      document.querySelectorAll('.lib-card-doc').forEach(card => card.addEventListener('click', e => { if (e.target.closest('button')) return; openDocumentEditor(card.dataset.docId); }));
      document.querySelectorAll('.lib-doc-pin').forEach(btn => btn.addEventListener('click', async e => {
        e.stopPropagation();
        const d = dbGetById('documents', btn.dataset.docId);
        if (d) { await dbUpdate('documents', d.id, { pinned: !d.pinned }); reloadData().then(() => appRenderWorkspace('library')); }
      }));
      document.querySelectorAll('.lib-doc-delete').forEach(btn => btn.addEventListener('click', async e => {
        e.stopPropagation();
        confirmAction('Delete document?', async () => { await dbSoftDelete('documents', btn.dataset.docId); reloadData().then(() => appRenderWorkspace('library')); });
      }));

      // File card actions
      document.querySelectorAll('.lib-file-view').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); openFileViewer(btn.dataset.fileId); }));
      document.querySelectorAll('.lib-card-file').forEach(card => card.addEventListener('click', e => { if (e.target.closest('button, a')) return; openFileViewer(card.dataset.fileId); }));
      document.querySelectorAll('.lib-file-delete').forEach(btn => btn.addEventListener('click', async e => {
        e.stopPropagation();
        confirmAction('Delete file?', async () => { await dbSoftDelete('files', btn.dataset.fileId); reloadData().then(() => appRenderWorkspace('library')); });
      }));
    }

    // ── Doc modal (full-screen editor overlay) ────────────────────────
    function openDocumentEditor(docId) {
      _docOpenId = docId || null;
      _docDirty = false;
      _docEditorActive = true;
      setState({ docModal: true });
    }

    function closeDocumentEditor() {
      _docEditorActive = false;
      _docOpenId = null;
      _docDirty = false;
      setState({ docModal: false });
    }

    function _reRenderDocModal() {
      const backdrop = document.getElementById('doc-modal-backdrop');
      if (!backdrop) return;
      backdrop.outerHTML = renderDocModal(getState());
      bindDocModal();
    }

    function renderDocModal(state) {
      if (!state.docModal) return '';
      const inner = renderDocumentEditor(state);
      return `<div class="doc-modal-backdrop" id="doc-modal-backdrop">
        <div class="doc-modal">

    // Helper: resolve a context-namespaced element id with fallback to the legacy

    // ── Bind panel ────────────────────────────────────────────────────
    function bindActionButtons(ctx) {

      ctxId('ai-action-no', ctx)?.addEventListener('click', () => applyPendingAction(false, ctx));

    function bindAIPanel() {

      document.getElementById('ai-expand-btn')?.addEventListener('click', () => setState({ aiPanelOpen: false, currentView: 'ai' }));
      document.getElementById('ai-load-btn-panel')?.addEventListener('click', () => startAILoad());
      document.getElementById('ai-settings-btn-panel')?.addEventListener('click', () => { _settingsSection = 'ai'; setState({ aiPanelOpen: false, currentView: 'settings' }); });
      document.getElementById('ai-open-wizard-empty-panel')?.addEventListener('click', () => { if (typeof openAIWizard === 'function') openAIWizard(1); });
      document.querySelectorAll('[data-suggest]').forEach(btn => btn.addEventListener('click', () => sendAIMessage(btn.dataset.suggest, 'panel')));

    function bindAIChatWorkspace() {
      document.getElementById('ai-load-btn')?.addEventListener('click', () => startAILoad());
      document.getElementById('ai-settings-btn')?.addEventListener('click', () => { _settingsSection = 'ai'; navigate('settings'); });
      document.getElementById('ai-open-wizard-empty')?.addEventListener('click', () => { if (typeof openAIWizard === 'function') openAIWizard(1); });
      document.getElementById('ai-open-wizard-toolbar')?.addEventListener('click', () => { if (typeof openAIWizard === 'function') openAIWizard(1); });
      document.getElementById('ai-clear')?.addEventListener('click', () => { _aiHistory = []; _pendingAction = null; appRenderWorkspace('ai'); });
      document.querySelectorAll('[data-suggest]').forEach(btn => btn.addEventListener('click', () => sendAIMessage(btn.dataset.suggest, 'workspace')));
      bindActionButtons('workspace');
      bindChatInput('workspace');

    function bindChatInput(ctx) {
      const input = ctxId('chat-input', ctx);
      const send = ctxId('chat-send', ctx);
      const doSend = () => {
        const t = input?.value?.trim();
        if (!t || !_aiReady || _aiStreaming) return;
        input.value = ''; input.style.height = '';
        sendAIMessage(t, ctx);
      };
      send?.addEventListener('click', doSend);
      input?.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); } });
      input?.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });
      bindModelPicker(ctx);
    }

    function bindModelPicker(ctx) {
      const ns = ctx === 'panel' ? 'panel' : 'ws';
      const btn = document.getElementById(`model-picker-${ns}`);
      btn?.addEventListener('click', async (e) => {
        e.stopPropagation();

        _modelPickerOpen = ns;
        rerenderChatInputArea(ctx);
        // Fetch Ollama list in background, then re-render so it appears in the dropdown
        if (!_ollamaModelsCache) {
          await fetchOllamaModels(true);
          if (_modelPickerOpen === ns) rerenderChatInputArea(ctx);

        // Close on outside click
        setTimeout(() => {
          const closeFn = (ev) => {
            if (!ev.target.closest(`#model-dropdown-${ns}`) && !ev.target.closest(`#model-picker-${ns}`)) {
              _modelPickerOpen = null;
              document.removeEventListener('click', closeFn);
              rerenderChatInputArea(ctx);

      document.querySelectorAll(`#model-dropdown-${ns} [data-model-id]`).forEach(opt => {
        opt.addEventListener('click', async (e) => {
          e.stopPropagation();

          const entry = STATIC_MODELS.find(m => m.id === id) || (_ollamaModelsCache || []).find(m => m.id === id);
          if (!entry) return;
          _modelPickerOpen = null;
          await selectModel(entry);
        });

    // Re-render just the chat body so the picker dropdown reflects current state
    // without nuking the input value the user is typing.
    function rerenderChatInputArea(ctx) {
      if (ctx === 'panel') {
        const pb = document.querySelector('#ai-panel .panel-body');
        if (pb) {
          // Preserve input value across re-render
          const oldInput = ctxId('chat-input', 'panel');
          const val = oldInput?.value || '';
          pb.innerHTML = renderChatBody(true);
          bindAIPanel();
          const newInput = ctxId('chat-input', 'panel');
          if (newInput) { newInput.value = val; newInput.focus(); }
        }
      } else {
        const oldInput = ctxId('chat-input', 'workspace');
        const val = oldInput?.value || '';
        appRenderWorkspace('ai');
        const newInput = ctxId('chat-input', 'workspace');
        if (newInput) { newInput.value = val; newInput.focus(); }
      }
    }

    // ── Send message: get model text, then dispatch to tool executor ─
    async function sendAIMessage(text, ctx) {
      if (_aiStreaming || _pendingAction) return;
      _aiStreaming = true;
      _aiHistory.push({ role: 'user', content: text });
      refreshChat(ctx);
      scrollChatBottom();

      try {
        if (!_aiReady) {
          _aiHistory.push({ role: 'assistant', content: 'AI not connected yet. Click "Connect AI" to get started.' });
        } else {
          const raw = await callBackend(buildSystemPrompt(), _aiHistory, ctx);
          await handleModelOutput(raw, ctx);
        }
      } catch (err) {
        console.error('[AI]', err);
        _aiHistory.push({ role: 'assistant', content: `Error: ${err.message}` });
      }

      _aiStreaming = false;
      finalRender(ctx);
      scrollChatBottom();
    }

    function finalRender(ctx) {
      if (ctx === 'panel') {
        const pb = document.querySelector('#ai-panel .panel-body');
        if (pb) { pb.innerHTML = renderChatBody(true); bindAIPanel(); }
      } else {
        appRenderWorkspace('ai');
      }
    }

    // ── Backend dispatch ─────────────────────────────────────────────
    async function callBackend(systemPrompt, history, ctx) {
      if (_aiBackend === 'nano') return callNano(systemPrompt, history, ctx);
      if (_aiBackend === 'ollama') return callOllama(systemPrompt, history, ctx);
      if (_aiBackend === 'webllm') return callWebLLM(systemPrompt, history, ctx);
      throw new Error('No AI backend connected');
    }

    // ── Chrome Built-in (Gemini Nano) ────────────────────────────────
    async function callNano(systemPrompt, history, ctx) {
      if (!_chromeSession || _chromeSession._sysPrompt !== systemPrompt) {
        const api = window.LanguageModel ?? window.ai?.languageModel;
        if (!api) throw new Error('LanguageModel API not available');
        _chromeSession = await api.create({
          expectedOutputs: [{ type: 'text', languages: ['en'] }],
          initialPrompts: [{ role: 'system', content: systemPrompt }],
        });
        _chromeSession._sysPrompt = systemPrompt;
      }
      const lastUserMsg = history[history.length - 1]?.content || '';
      let response = '';
      try {
        const stream = _chromeSession.promptStreaming(lastUserMsg);
        for await (const chunk of stream) {
          if (typeof chunk !== 'string') continue;
          response = chunk.startsWith(response) && chunk.length >= response.length
            ? chunk : response + chunk;
          streamToBubble(response);
        }
      } catch (e) {
        console.warn('[AI] Nano streaming failed, fallback:', e.message);
        response = await _chromeSession.prompt(lastUserMsg);
      }
      return (typeof response === 'string' ? response : '').trim();
    }

    // ── Ollama ───────────────────────────────────────────────────────
    async function callOllama(systemPrompt, history, ctx) {
      const messages = [
        { role: 'system', content: systemPrompt },
        ...history.map(m => ({ role: m.role, content: m.content }))
      ];
      const resp = await fetch(`${_aiPrefs.ollamaUrl}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: _aiPrefs.ollamaModel, messages, stream: true }),
      });
      if (!resp.ok) throw new Error(`Ollama error ${resp.status}: ${await resp.text()}`);
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let full = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const lines = dec.decode(value, { stream: true }).split('\n').filter(Boolean);
        for (const line of lines) {
          try {
            const json = JSON.parse(line);
            full += json?.message?.content || '';
            streamToBubble(full);
            if (json.done) break;
          } catch { }
        }
      }
      return full.trim();
    }

    // ── In-browser transformers.js (WebGPU Gemma 4) — low-level API ──
    async function callWebLLM(systemPrompt, history, ctx) {
      if (!_webllmPipeline || !_webllmPipeline.model || !_webllmPipeline.processor)
        throw new Error('In-browser model not loaded');
      const { model, processor, TextStreamer } = _webllmPipeline;
      const messages = [
        { role: 'system', content: systemPrompt },
        ...history.map(m => ({ role: m.role, content: m.content })),
      ];
      const prompt = processor.apply_chat_template(messages, {
        enable_thinking: false,
        add_generation_prompt: true,
      });
      const inputs = await processor(prompt, null, null, { add_special_tokens: false });
      let full = '';
      const streamer = new TextStreamer(processor.tokenizer, {
        skip_prompt: true,
        skip_special_tokens: true,
        callback_function: (text) => { full += text; streamToBubble(full); },
      });
      await model.generate({ ...inputs, max_new_tokens: 512, do_sample: false, streamer });
      return (full || '').trim();
    }

    function streamToBubble(text) {
      // Update whichever streaming bubble is in the DOM (workspace or panel)
      const html = escH(text) + '<span class="spinner" style="width:10px;height:10px;margin-left:4px;vertical-align:middle"></span>';
      document.querySelectorAll('[id^="streaming-bubble"]').forEach(el => { el.innerHTML = html; });
    }

    // ── Tool dispatch: parse model output, route to tool or speak ────
    async function handleModelOutput(raw, ctx) {
      if (!raw) { _aiHistory.push({ role: 'assistant', content: '(no response)' }); return; }
      const tc = extractToolCall(raw);
      if (!tc) {
        _aiHistory.push({ role: 'assistant', content: raw });
        return;
      }
      await routeToolCall(tc, ctx);
    }

    function extractToolCall(text) {
      // Find first balanced JSON object containing a "tool" key.
      const start = text.indexOf('{');
      if (start < 0) return null;
      let depth = 0, inStr = false, esc = false;
      for (let i = start; i < text.length; i++) {
        const c = text[i];
        if (esc) { esc = false; continue; }
        if (c === '\\') { esc = true; continue; }
        if (c === '"') { inStr = !inStr; continue; }
        if (inStr) continue;
        if (c === '{') depth++;
        else if (c === '}') {
          depth--;
          if (depth === 0) {
            const candidate = text.slice(start, i + 1);
            try {
              const parsed = JSON.parse(candidate);
              if (parsed && typeof parsed === 'object' && typeof parsed.tool === 'string') return parsed;
            } catch { }
            return null;
          }
        }
      }
      return null;
    }

    async function routeToolCall(tc, ctx) {
      const tool = tc.tool;
      const args = tc.args || {};
      if (!AI_TOOLS[tool]) {
        _aiHistory.push({ role: 'assistant', content: `(Unknown tool "${tool}". I'll answer in plain text instead.) ${tc.summary || ''}` });
        return;
      }
      // Read-only tools execute immediately.
      const readOnly = ['query_records', 'count_records', 'summarize_record', 'get_running_timer', 'list_files', 'answer_question', 'navigate'];
      if (readOnly.includes(tool)) {
        try {
          const result = await execTool(tool, args);
          const reply = await speakResult(tool, args, result, ctx);
          _aiHistory.push({ role: 'assistant', content: reply });
        } catch (e) {
          _aiHistory.push({ role: 'assistant', content: `Couldn't run ${tool}: ${e.message}` });
        }
        return;
      }
      // Writes → stage as pending action with summary, awaiting Yes/No.
      const summary = summarizeAction(tool, args);
      _pendingAction = { tool, args, summary };
    }

    async function applyPendingAction(yes, ctx) {
      if (!_pendingAction) return;
      const { tool, args } = _pendingAction;
      _pendingAction = null;
      if (!yes) {
        _aiHistory.push({ role: 'assistant', content: 'Cancelled.' });
        finalRender(ctx); return;
      }
      try {
        const result = await execTool(tool, args);
        reloadData();
        const reply = await speakResult(tool, args, result, ctx);
        _aiHistory.push({ role: 'assistant', content: reply });
        showToast(`${tool.replace('_', ' ')} ✓`, 'success');
      } catch (e) {
        _aiHistory.push({ role: 'assistant', content: `Failed: ${e.message}` });
        showToast(`Action failed: ${e.message}`, 'error');
      }
      finalRender(ctx);
    }

    function summarizeAction(tool, args) {
      if (tool === 'create_record') return `Create ${args.store?.replace(/s$/, '') || 'record'}:\n${JSON.stringify(args.fields || {}, null, 2)}`;
      if (tool === 'update_record') return `Update ${args.store} "${args.id_or_name}":\n${JSON.stringify(args.changes || {}, null, 2)}`;
      if (tool === 'delete_record') return `Move to Trash: ${args.store} "${args.id_or_name}"`;
      if (tool === 'start_timer') return `Start timer${args.taskId_or_name ? ` on "${args.taskId_or_name}"` : ''}${args.description ? ` (${args.description})` : ''}`;
      if (tool === 'stop_timer') return `Stop the running timer`;
      if (tool === 'log_communication') return `Log ${args.type || 'communication'}${args.subject ? ` "${args.subject}"` : ''}${args.relatedTo ? ` on ${args.relatedTo.store} "${args.relatedTo.id_or_name}"` : ''}:\n${args.body || ''}`;
      if (tool === 'attach_file') return `Attach file "${args.name}"${args.relatedTo ? ` to ${args.relatedTo.store} "${args.relatedTo.id_or_name}"` : ''}`;
      return `${tool}: ${JSON.stringify(args)}`;
    }

    // ── Tool executor ────────────────────────────────────────────────
    function resolveRecord(store, idOrName) {
      if (!idOrName) return null;
      const all = getStore(store);
      let hit = all.find(r => r.id === idOrName);
      if (hit) return hit;
      const needle = String(idOrName).toLowerCase().trim();
      const nameKey = store === 'tasks' ? 'title' : 'name';
      hit = all.find(r => (r[nameKey] || '').toLowerCase() === needle);
      if (hit) return hit;
      hit = all.find(r => (r[nameKey] || '').toLowerCase().includes(needle));
      return hit || null;
    }

    function matchesFilter(rec, store, filter) {
      if (!filter) return true;
      if (filter.status && rec.status !== filter.status) return false;
      if (filter.stage && rec.stage !== filter.stage) return false;
      if (filter.priority && rec.priority !== filter.priority) return false;
      if (filter.search) {
        const blob = JSON.stringify(rec).toLowerCase();
        if (!blob.includes(String(filter.search).toLowerCase())) return false;
      }
      if (filter.clientId && rec.clientId !== filter.clientId) return false;
      if (filter.assigneeId && rec.assigneeId !== filter.assigneeId) return false;
      if (filter.clientName) {
        const c = resolveRecord('clients', filter.clientName);
        if (!c || rec.clientId !== c.id) return false;
      }
      if (filter.assigneeName) {
        const p = resolveRecord('people', filter.assigneeName);
        if (!p || rec.assigneeId !== p.id) return false;
      }
      if (rec.dueDate) {
        const diff = daysUntil(rec.dueDate);
        if (diff === null) return !(filter.overdue || filter.dueToday || filter.dueSoon);
        if (filter.overdue && diff >= 0) return false;
        if (filter.dueToday && diff !== 0) return false;
        if (filter.dueSoon && (diff < 0 || diff > 3)) return false;
      } else {
        if (filter.overdue || filter.dueToday || filter.dueSoon) return false;
      }
      return true;
    }

    async function execTool(tool, args) {
      switch (tool) {
        case 'create_record': {
          const { store, fields = {} } = args;
          if (!SCHEMAS[store]) throw new Error(`Unknown store: ${store}`);
          // Resolve relation-by-name fields → id
          for (const f of SCHEMAS[store].fields) {
            if (f.type === 'relation' && fields[f.key] && !dbGetById(f.store, fields[f.key])) {
              const r = resolveRecord(f.store, fields[f.key]);
              if (r) fields[f.key] = r.id;
            }
          }
          return await dbCreate(store, fields);
        }
        case 'update_record': {
          const { store, id_or_name, changes = {} } = args;
          if (!SCHEMAS[store]) throw new Error(`Unknown store: ${store}`);
          const rec = resolveRecord(store, id_or_name);
          if (!rec) throw new Error(`No ${store} matching "${id_or_name}"`);
          for (const f of SCHEMAS[store].fields) {
            if (f.type === 'relation' && changes[f.key] && !dbGetById(f.store, changes[f.key])) {
              const r = resolveRecord(f.store, changes[f.key]);

          }
          return await dbUpdate(store, rec.id, changes);
        }
        case 'delete_record': {
          const { store, id_or_name } = args;
          const rec = resolveRecord(store, id_or_name);
          if (!rec) throw new Error(`No ${store} matching "${id_or_name}"`);
          await softDelete(store, rec.id);
          return { id: rec.id, moved: 'trash' };
        }
        case 'query_records': {
          const { store, filter } = args;
          if (!SCHEMAS[store] && store !== 'communications' && store !== 'files') throw new Error(`Unknown store: ${store}`);
          return getStore(store).filter(r => matchesFilter(r, store, filter));

        case 'count_records': {
          const { store, filter } = args;
          return { count: getStore(store).filter(r => matchesFilter(r, store, filter)).length };
        }
        case 'summarize_record': {
          const { store, id_or_name } = args;
          const rec = resolveRecord(store, id_or_name);
          if (!rec) throw new Error(`No ${store} matching "${id_or_name}"`);
          const extras = {};
          if (store === 'projects') extras.tasks = getStore('tasks').filter(t => t.projectId === rec.id);
          if (store === 'clients') extras.projects = getStore('projects').filter(p => p.clientId === rec.id);
          if (store === 'people') extras.assignedTasks = getStore('tasks').filter(t => t.assigneeId === rec.id);
          return { record: rec, ...extras };
        }
        case 'start_timer': {
          const task = args.taskId_or_name ? resolveRecord('tasks', args.taskId_or_name) : null;
          return await startTimer(task?.id || null, args.description || '');
        }
        case 'stop_timer': {
          const r = getRunningTimer();
          if (!r) return { running: false };
          return await stopTimer(r.id);
        }
        case 'get_running_timer': {
          const r = getRunningTimer();
          if (!r) return { running: false };
          const task = r.taskId ? dbGetById('tasks', r.taskId) : null;
          return { running: true, since: r.startedAt, task: task ? task.title : null, description: r.description };
        }
        case 'navigate': {
          const valid = ['dashboard', 'clients', 'departments', 'projects', 'tasks', 'people', 'calendar', 'time', 'reports', 'settings', 'trash', 'ai'];
          if (!valid.includes(args.view)) throw new Error(`Unknown view: ${args.view}`);
          setTimeout(() => navigate(args.view), 50);
          return { navigated: args.view };
        }
        case 'log_communication': {
          const rec = { type: args.type || 'Note', subject: args.subject || '', body: args.body || '', date: nowISO() };
          if (args.relatedTo) {
            const r = resolveRecord(args.relatedTo.store, args.relatedTo.id_or_name);
            if (r) { rec.relatedStore = args.relatedTo.store; rec.relatedId = r.id; }
          }
          return await dbCreate('communications', rec);
        }
        case 'attach_file': {
          const rec = { name: args.name, url: args.url || '', addedAt: nowISO() };
          if (args.relatedTo) {
            const r = resolveRecord(args.relatedTo.store, args.relatedTo.id_or_name);
            if (r) { rec.relatedStore = args.relatedTo.store; rec.relatedId = r.id; }
          }
          return await dbCreate('files', rec);
        }
        case 'list_files': {
          let list = getStore('files');
          if (args.relatedTo) {
            const r = resolveRecord(args.relatedTo.store, args.relatedTo.id_or_name);
            if (r) list = list.filter(f => f.relatedId === r.id);
          }
          return list;
        }
        case 'answer_question': {
          return { context: buildDataSummary(), question: args.question };
        }
        default:
          throw new Error(`Tool not implemented: ${tool}`);
      }
    }

    // ── Build a compact summary of current CRM data for context ──────
    function buildDataSummary() {
      const s = getState();
      const tasks = s.tasks || [], projects = s.projects || [], clients = s.clients || [], people = s.people || [];
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const overdue = tasks.filter(t => { const d = daysUntil(t.dueDate); return d !== null && d < 0 && t.status !== 'Done'; }).length;
      const open = tasks.filter(t => t.status !== 'Done').length;
      const activeClients = clients.filter(c => c.stage === 'Active').length;
      const activeProjects = projects.filter(p => p.stage === 'Active').length;
      const lines = [
        `Counts: clients=${clients.length} (active=${activeClients}), projects=${projects.length} (active=${activeProjects}), tasks=${tasks.length} (open=${open}, overdue=${overdue}), people=${people.length}.`,
        `Open tasks: ${tasks.filter(t => t.status !== 'Done').slice(0, 15).map(t => `"${t.title}" [${t.status}${t.dueDate ? `, due ${t.dueDate}` : ''}]`).join('; ') || 'none'}.`,
        `Active projects: ${projects.filter(p => p.stage === 'Active').slice(0, 10).map(p => `"${p.name}"${p.dueDate ? ` due ${p.dueDate}` : ''}`).join('; ') || 'none'}.`,
        `Clients: ${clients.slice(0, 10).map(c => `"${c.name}" [${c.stage || '?'}]`).join('; ') || 'none'}.`,
      ];
      return lines.join('\n');
    }

    async function loadNano(updateTxt) {

      if (avail === 'unavailable') throw new Error('Gemini Nano not available on this device');

            if (status === 'available' || status === 'readily') { clearInterval(poll); resolve(); }

    async function loadOllama(updateTxt) {

    async function loadWebLLM(updateTxt) {

      const modelId = modelDef?.hf || 'onnx-community/gemma-4-E2B-it-ONNX';
      updateTxt(`Loading ${modelId}…`);

      const progress_callback = (p) => {
        if (p.status === 'progress' && p.total) {
          _webllmLoadProgress = p.loaded / p.total;
          updateTxt(`Loading ${p.file || 'model'}: ${Math.round(_webllmLoadProgress * 100)}%`);
        } else if (p.status === 'ready') updateTxt('Compiling model on GPU…');
        else if (p.status === 'initiate' || p.status === 'download') updateTxt(`Fetching ${p.file || 'weights'}…`);
      };

      // Match the model card's official sample code (low-level API), hard-coded
      // dtype/device — these must be string literals identical to the working
      // reference (nexus-crm_05_14_2026_WorkingBeforeMajorAi.html / tkapp.html).
      const processor = await AutoProcessor.from_pretrained(modelId, { progress_callback });

        dtype: 'q4f16',

        skip_prompt: true, skip_special_tokens: true,
        callback_function: (t) => { warm += t; },

    }

# Kubernetes NetworkPolicy template for tktaskapp-server
#
# Default posture: deny all ingress and egress.
# Only the explicitly listed traffic is permitted.
#
# Render before applying:
#   KMS_EGRESS_CIDR=<approved-cidr> IDP_EGRESS_CIDR=<approved-cidr> pnpm run render:k8s:network-policy
#
# The render script fails closed on missing values, 0.0.0.0/0, ::/0, and
# documentation-only CIDRs.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tktaskapp-server
  namespace: tktaskapp
  labels:
    app: tktaskapp-server
spec:
  podSelector:
    matchLabels:
      app: tktaskapp-server
  policyTypes:
    - Ingress
    - Egress

  # ── Ingress ────────────────────────────────────────────────────────────────
  # Allow inbound traffic on port 3000 from the load balancer / ingress controller only.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # Adjust to match the namespace where your ingress controller runs.
              # nginx-ingress: kubernetes.io/metadata.name: ingress-nginx
              # AWS ALB controller: kubernetes.io/metadata.name: kube-system
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000

  # ── Egress ─────────────────────────────────────────────────────────────────
  # Explicitly allow only the four required destinations.
  # All other outbound connections are dropped by the default-deny posture.
  egress:
    # 1. PostgreSQL (in-cluster)
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

    # 2. KMS endpoint
    - to:
        - ipBlock:
            cidr: '${KMS_EGRESS_CIDR}'
      ports:
        - protocol: TCP
          port: 443

    # 3. Identity Provider (IdP / OIDC issuer)
    #    This template intentionally has no 0.0.0.0/0 HTTPS egress.
    - to:
        - ipBlock:
            cidr: '${IDP_EGRESS_CIDR}'
      ports:
        - protocol: TCP
          port: 443

    # 4. OpenTelemetry Collector (in-cluster)
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4317 # gRPC OTLP

    # 5. DNS — required for hostname resolution of external endpoints
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

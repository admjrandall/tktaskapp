openapi: 3.1.0

info:
  title: Task App CRM API
  version: 0.1.0
  description: |
    REST API for the Task App CRM enterprise server.

    This is a design scaffold. Paths are stubs — no implementation exists yet.
    Full implementation begins in Phase 9+ (enterprise server).

    ## Authentication

    All endpoints (except `/api/v1/auth/*`) require a Bearer token issued
    by the configured OIDC provider. PKCE (S256 code challenge) is mandatory
    for all authorization-code flows. Implicit flow is not supported.

    ## Tenant isolation

    Every request is scoped to the tenant identified in the OIDC token's `tid` claim.
    Cross-tenant access is never permitted — it is rejected at the authorization
    middleware layer before any handler is reached.

    ## Versioning

    The API is versioned in the URL path (`/api/v1/...`). Breaking changes produce
    a new version prefix. Non-breaking additions (new optional fields, new optional
    query parameters) may appear within an existing version. See `docs/api/CHANGELOG.md`.

  contact:
    name: Task App CRM team
    email: developer@techkeycloud.com

  license:
    name: Proprietary
    identifier: LicenseRef-proprietary

servers:
  - url: https://api.example.com
    description: Production (placeholder — replace with actual domain before launch)
  - url: https://staging-api.example.com
    description: Staging
  - url: http://localhost:3000
    description: Local development

# ---------------------------------------------------------------------------
# Security schemes
# ---------------------------------------------------------------------------

components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC-issued access token (JWT). Obtained via authorization-code + PKCE flow.
        Access tokens expire after 15 minutes (900 seconds).
        Refresh via the token endpoint using a one-time-use refresh token.

    # DPoP binding — near-term addition for high-assurance deployments (RFC 9449).
    # Not yet enforced; documented here so API clients can plan for it.
    dpopToken:
      type: http
      scheme: bearer
      bearerFormat: DPoP
      description: |
        DPoP-bound access token (RFC 9449). Required for high-assurance enterprise
        tenants. When required, the `DPoP` header must accompany every request with
        a signed DPoP proof JWT.

  # ---------------------------------------------------------------------------
  # Shared parameters
  # ---------------------------------------------------------------------------

  parameters:
    recordId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Record UUID

    pageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    pageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    searchParam:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Substring search across name/title fields

  # ---------------------------------------------------------------------------
  # Shared response schemas
  # ---------------------------------------------------------------------------

  schemas:
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: RECORD_NOT_FOUND
        message:
          type: string
          description: Human-readable error summary (English; not for end-user display)
          example: Client with id 'abc-123' was not found in this tenant
        requestId:
          type: string
          description: Request ID for correlation with server logs
          example: req-01j2xmv8h0000000a3b4c5d6e
        details:
          type: object
          description: Optional structured details (field-level validation errors, etc.)
          additionalProperties: true

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    AuditMeta:
      type: object
      required: [createdAt, updatedAt, createdBy, updatedBy]
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: User sub (pseudonymous) who created the record
        updatedBy:
          type: string
          description: User sub (pseudonymous) who last modified the record

    # --- CRM record stubs ---

    ClientSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [Active, Inactive, Lead, Archived]
        industry:
          type: string
          maxLength: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClientDetail:
      allOf:
        - $ref: '#/components/schemas/ClientSummary'
        - type: object
          properties:
            notes:
              type: string
              maxLength: 10000
            website:
              type: string
              format: uri
            primaryContactId:
              type: string
              format: uuid
              nullable: true
            departmentIds:
              type: array
              items:
                type: string
                format: uuid
            audit:
              $ref: '#/components/schemas/AuditMeta'

    ProjectSummary:
      type: object
      required: [id, name, clientId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        clientId:
          type: string
          format: uuid
        stage:
          type: string
          enum: [Lead, Active, Review, On Hold, Done, Cancelled]
        priority:
          type: string
          enum: [Low, Medium, High, Critical]
        dueDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          properties:
            description:
              type: string
              maxLength: 10000
            budget:
              type: number
              nullable: true
            assigneeIds:
              type: array
              items:
                type: string
                format: uuid
            audit:
              $ref: '#/components/schemas/AuditMeta'

    TaskSummary:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [Todo, In Progress, Blocked, Done]
        priority:
          type: string
          enum: [Low, Medium, High, Critical]
        dueDate:
          type: string
          format: date
          nullable: true
        projectId:
          type: string
          format: uuid
          nullable: true
        assigneeId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          properties:
            description:
              type: string
              maxLength: 10000
            tags:
              type: array
              items:
                type: string
            audit:
              $ref: '#/components/schemas/AuditMeta'

    DocumentSummary:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentDetail:
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          properties:
            body:
              type: string
              description: Document body — plain text or markdown
            audit:
              $ref: '#/components/schemas/AuditMeta'

    AuditEvent:
      type: object
      required: [id, eventType, userId, tenantId, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          description: Event type code (e.g. RECORD_CREATED, AI_MUTATION_APPLIED, KEY_DESTROYED)
          example: RECORD_CREATED
        userId:
          type: string
          description: Pseudonymous user sub from OIDC token
        tenantId:
          type: string
          description: Pseudonymous tenant identifier
        occurredAt:
          type: string
          format: date-time
        resourceType:
          type: string
          description: CRM store name (e.g. clients, tasks)
          nullable: true
        resourceId:
          type: string
          format: uuid
          nullable: true
        requestId:
          type: string
          description: Request ID for trace correlation
        metadata:
          type: object
          description: Event-specific structured metadata (no PII)
          additionalProperties: true

    UserSummary:
      type: object
      required: [id, tenantId, status]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        status:
          type: string
          enum: [active, suspended, pending_erasure, erased]
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
          nullable: true

  # ---------------------------------------------------------------------------
  # Shared responses
  # ---------------------------------------------------------------------------

  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Access token is missing, expired, or invalid
            requestId: req-01j2xmv8h0000000a3b4c5d6e

    Forbidden:
      description: Valid token but insufficient permissions for this operation or resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: You do not have permission to perform this action
            requestId: req-01j2xmv8h0000000a3b4c5d6e

    NotFound:
      description: Record does not exist in this tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RECORD_NOT_FOUND
            message: The requested record was not found
            requestId: req-01j2xmv8h0000000a3b4c5d6e

    UnprocessableEntity:
      description: Validation failure — request body failed schema validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

# ---------------------------------------------------------------------------
# Global security (applied to all paths unless overridden)
# ---------------------------------------------------------------------------

security:
  - oidcBearer: []

# ---------------------------------------------------------------------------
# Tags
# ---------------------------------------------------------------------------

tags:
  - name: clients
    description: CRM client organisation records
  - name: projects
    description: Projects associated with clients
  - name: tasks
    description: Tasks associated with projects or clients
  - name: documents
    description: Long-form documents (notes, briefs, reports)
  - name: audit
    description: Immutable audit event log (read-only for non-admin roles)
  - name: admin-users
    description: |
      Tenant user management. Admin role required for all endpoints in this tag.
      Includes GDPR Article 17 erasure workflow.

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------

paths:
  # ── Clients ──────────────────────────────────────────────────────────────

  /api/v1/clients:
    get:
      tags: [clients]
      summary: List clients
      description: Returns a paginated list of clients in the tenant. Results are sorted by `updatedAt` descending.
      operationId: listClients
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - $ref: '#/components/parameters/searchParam'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Active, Inactive, Lead, Archived]
      responses:
        '200':
          description: Paginated list of clients
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      tags: [clients]
      summary: Create a client
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 200
                status:
                  type: string
                  enum: [Active, Inactive, Lead, Archived]
                  default: Active
                industry:
                  type: string
                  maxLength: 100
                notes:
                  type: string
                  maxLength: 10000
                website:
                  type: string
                  format: uri
      responses:
        '201':
          description: Client created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/clients/{id}:
    parameters:
      - $ref: '#/components/parameters/recordId'

    get:
      tags: [clients]
      summary: Get a client by ID
      operationId: getClient
      responses:
        '200':
          description: Client detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [clients]
      summary: Update a client (partial)
      operationId: updateClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                status:
                  type: string
                  enum: [Active, Inactive, Lead, Archived]
                industry:
                  type: string
                  maxLength: 100
                notes:
                  type: string
                  maxLength: 10000
                website:
                  type: string
                  format: uri
      responses:
        '200':
          description: Updated client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [clients]
      summary: Soft-delete a client (moves to trash)
      operationId: deleteClient
      responses:
        '204':
          description: Client moved to trash
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Projects ──────────────────────────────────────────────────────────────

  /api/v1/projects:
    get:
      tags: [projects]
      summary: List projects
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - $ref: '#/components/parameters/searchParam'
        - name: clientId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: stage
          in: query
          required: false
          schema:
            type: string
            enum: [Lead, Active, Review, On Hold, Done, Cancelled]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [Low, Medium, High, Critical]
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [projects]
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, clientId]
              properties:
                name:
                  type: string
                  maxLength: 200
                clientId:
                  type: string
                  format: uuid
                stage:
                  type: string
                  enum: [Lead, Active, Review, On Hold, Done, Cancelled]
                  default: Lead
                priority:
                  type: string
                  enum: [Low, Medium, High, Critical]
                  default: Medium
                description:
                  type: string
                  maxLength: 10000
                dueDate:
                  type: string
                  format: date
                budget:
                  type: number
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/recordId'

    get:
      tags: [projects]
      summary: Get a project by ID
      operationId: getProject
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [projects]
      summary: Update a project (partial)
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                stage:
                  type: string
                  enum: [Lead, Active, Review, On Hold, Done, Cancelled]
                priority:
                  type: string
                  enum: [Low, Medium, High, Critical]
                description:
                  type: string
                  maxLength: 10000
                dueDate:
                  type: string
                  format: date
                budget:
                  type: number
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [projects]
      summary: Soft-delete a project
      operationId: deleteProject
      responses:
        '204':
          description: Project moved to trash
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Tasks ─────────────────────────────────────────────────────────────────

  /api/v1/tasks:
    get:
      tags: [tasks]
      summary: List tasks
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - $ref: '#/components/parameters/searchParam'
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Todo, In Progress, Blocked, Done]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [Low, Medium, High, Critical]
        - name: assigneeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: overdue
          in: query
          required: false
          schema:
            type: boolean
          description: If true, return only tasks whose dueDate is in the past and status is not Done
        - name: dueToday
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated list of tasks
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [tasks]
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 500
                status:
                  type: string
                  enum: [Todo, In Progress, Blocked, Done]
                  default: Todo
                priority:
                  type: string
                  enum: [Low, Medium, High, Critical]
                  default: Medium
                description:
                  type: string
                  maxLength: 10000
                dueDate:
                  type: string
                  format: date
                projectId:
                  type: string
                  format: uuid
                assigneeId:
                  type: string
                  format: uuid
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/recordId'

    get:
      tags: [tasks]
      summary: Get a task by ID
      operationId: getTask
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [tasks]
      summary: Update a task (partial)
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 500
                status:
                  type: string
                  enum: [Todo, In Progress, Blocked, Done]
                priority:
                  type: string
                  enum: [Low, Medium, High, Critical]
                description:
                  type: string
                  maxLength: 10000
                dueDate:
                  type: string
                  format: date
                assigneeId:
                  type: string
                  format: uuid
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags: [tasks]
      summary: Soft-delete a task
      operationId: deleteTask
      responses:
        '204':
          description: Task moved to trash
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Documents ─────────────────────────────────────────────────────────────

  /api/v1/documents:
    get:
      tags: [documents]
      summary: List documents
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - $ref: '#/components/parameters/searchParam'
      responses:
        '200':
          description: Paginated list of documents
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [documents]
      summary: Create a document
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 500
                body:
                  type: string
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/recordId'

    get:
      tags: [documents]
      summary: Get a document by ID
      operationId: getDocument
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':

  # ── Audit ─────────────────────────────────────────────────────────────────

  /api/v1/audit:
    get:
      tags: [audit]
      summary: Query audit events
      description: |
        Returns a paginated, append-only log of audit events for the tenant.
        Events are sorted by `occurredAt` descending (most recent first).

        This endpoint is read-only — audit events cannot be modified or deleted
        via the API. The audit store uses append-only database semantics enforced
        at the database layer.

        Requires the `audit:read` scope or an admin role.
      operationId: listAuditEvents
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - name: eventType
          in: query
          required: false
          schema:
            type: string
          description: Filter by event type code
        - name: userId
          in: query
          required: false
          schema:
            type: string
          description: Filter by user sub (pseudonymous)
        - name: resourceType
          in: query
          required: false
          schema:
            type: string
          description: Filter by CRM store name
        - name: resourceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter events at or after this timestamp (ISO 8601 UTC)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter events at or before this timestamp (ISO 8601 UTC)
      responses:
        '200':
          description: Paginated list of audit events
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/audit/export:
    get:
      tags: [audit]
      summary: Export audit log as CSV or JSON Lines
      description: |
        Streams the full audit log for the tenant in the requested format.
        This operation is itself audited (AUDIT_LOG_EXPORTED event).
        Requires an admin role.
      operationId: exportAuditLog
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, jsonl]
            default: jsonl
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Audit log stream
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/x-ndjson:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Admin: Users ──────────────────────────────────────────────────────────

  /api/v1/admin/users:
    get:
      tags: [admin-users]
      summary: List tenant users
      description: Admin role required.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, suspended, pending_erasure, erased]
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/recordId'

    get:
      tags: [admin-users]
      summary: Get a user by ID
      description: Admin role required.
      operationId: getUser
      responses:
        '200':
          description: User summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/users/{id}/suspend:
    parameters:
      - $ref: '#/components/parameters/recordId'
    post:
      tags: [admin-users]
      summary: Suspend a user account
      description: |
        Immediately revokes all active sessions for this user and prevents new logins.
        Admin role required. This operation is audited.
      operationId: suspendUser
      responses:
        '204':
          description: User suspended
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/users/{id}/erase:
    parameters:
      - $ref: '#/components/parameters/recordId'
    post:
      tags: [admin-users]
      summary: Schedule GDPR Article 17 erasure for a user
      description: |
        Initiates the GDPR crypto-shredding erasure workflow:
        1. Sets user status to `pending_erasure`
        2. Revokes all active sessions
        3. Schedules KMS key destruction at `destroyAt`
        4. Records a signed DSAR audit evidence entry

        After `destroyAt`, the user's KMS key is destroyed and all their
        encrypted data becomes permanently unreadable. This operation is
        irreversible after the key is destroyed.

        Admin role + step-up authentication required.
        See `docs/architecture/0006-gdpr-crypto-shredding.md`.
      operationId: scheduleUserErasure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destroyAt]
              properties:
                destroyAt:
                  type: string
                  format: date-time
                  description: |
                    ISO 8601 UTC timestamp when the KMS key will be destroyed.
                    Must be at least 24 hours in the future to allow for legal hold checks.
                reason:
                  type: string
                  maxLength: 1000
                  description: DSAR reference or administrative reason (not stored in PII logs)
      responses:
        '202':
          description: Erasure scheduled — key will be destroyed at the specified time
          content:
            application/json:
              schema:
                type: object
                required: [userId, destroyAt, auditEventId]
                properties:
                  userId:
                    type: string
                  destroyAt:
                    type: string
                    format: date-time
                  auditEventId:
                    type: string
                    format: uuid
                    description: Audit event ID for the DSAR evidence record
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Legal hold is active — erasure cannot be scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: LEGAL_HOLD_ACTIVE
                message: A legal hold is active for this user. Resolve the hold before scheduling erasure.
                requestId: req-01j2xmv8h0000000a3b4c5d6e

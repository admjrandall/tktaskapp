name: Accessibility

on:
  push:
    branches: [master, main]
    paths:
      - 'packages/core/src/**'
      - 'apps/offline-web/**'
      - 'dist/offline/index.html'
  pull_request:
    paths:
      - 'packages/core/src/**'
      - 'apps/offline-web/**'
      - 'dist/offline/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    name: axe-core accessibility scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build offline artifact
        run: pnpm run build:offline

      # axe-core/cli cannot load a file:// URL in a headless browser environment.
      # We serve the built single-file artifact via a minimal HTTP server (http-server)
      # so that axe can run against http://localhost:8080, which is functionally identical
      # to the file:// experience for markup and ARIA analysis.
      #
      # Rules that specifically require file:// behaviour (e.g. service worker scope) are
      # excluded below because they cannot be tested via local HTTP in CI — note them here
      # so they are tested manually before any production release:
      #   - Service worker scope rules (not applicable: offline build has no SW)
      #   - Mixed content rules (not applicable: no network assets in single-file build)
      - name: Install http-server
        run: pnpm add -g http-server

      - name: Start HTTP server (background)
        run: http-server dist/offline -p 8080 --cors -c-1 &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:8080 --timeout 30000

      - name: Install @axe-core/cli
        run: pnpm add -g @axe-core/cli

      # Run axe against the login/unlock page (pre-auth state).
      # The app loads into the login screen when no vault exists.
      # Post-auth views require vault credentials and cannot be tested in CI without
      # a pre-seeded vault — test those views manually or with Playwright + seeded state.
      #
      # Rules disabled in CI:
      #   color-contrast         — headless Chrome colour rendering can differ from real browser;
      #                            test manually in production build. Re-enable once design tokens
      #                            are confirmed against WCAG 1.4.3 ratio.
      #   scrollable-region-focusable — false positive on single-file build's root scroll area;
      #                            review after WCAG 2.1 §2.1.1 remediation pass.
      - name: Run axe-core scan (pre-auth page)
        run: |
          axe http://localhost:8080 \
            --exit \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa,best-practice \
            --disable color-contrast,scrollable-region-focusable \
            --reporter cli
        continue-on-error: false

      # Save the full JSON report as an artifact so violations can be reviewed in detail.
      - name: Run axe-core scan (JSON report)
        if: always()
        run: |
          axe http://localhost:8080 \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa,best-practice \
            --disable color-contrast,scrollable-region-focusable \
            --reporter json \
            --stdout > axe-report.json || true

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axe-accessibility-report
          path: axe-report.json
          retention-days: 30

  # Full Playwright E2E accessibility suite — keyboard navigation, focus traps,
  # ARIA labels, and WCAG 2.1 AA interaction compliance.
  # Runs against dist/offline/index.html served via file:// via Chromium.
  playwright-a11y:
    name: Playwright E2E accessibility tests
    runs-on: ubuntu-latest
    needs: axe # axe scan must pass before we run the interactive tests
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build offline artifact
        run: pnpm run build:offline

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E accessibility tests
        run: pnpm exec playwright test tests/e2e/accessibility/
        env:
          # file:// URL for the built offline app — playwright.config.ts reads this
          PLAYWRIGHT_BASE_URL: file://${{ github.workspace }}/dist/offline/index.html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-accessibility-report
          path: playwright-report/
          retention-days: 30

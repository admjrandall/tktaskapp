name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a
        with:
          version: 11.1.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Build offline
        run: pnpm run build:offline

      - name: Build offline no-ai
        run: pnpm run build:offline:no-ai

      - name: Build offline internal-ai
        run: pnpm run build:offline:internal-ai

      - name: Build enterprise
        run: pnpm run build:enterprise

      - name: Build dataverse
        run: pnpm run build:dataverse

      - name: Upload offline build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-offline
          path: dist/offline/index.html
          retention-days: 30

      - name: Upload offline no-ai build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-offline-no-ai
          path: dist/offline-no-ai/index.html
          retention-days: 30

      - name: Upload offline internal-ai build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-offline-internal-ai
          path: dist/offline-internal-ai/index.html
          retention-days: 30

      - name: Upload enterprise build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-enterprise
          path: dist/enterprise/
          retention-days: 30

      - name: Upload dataverse build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-dataverse
          path: dist/dataverse/
          retention-days: 30

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Build offline
        run: pnpm run build:offline

      - name: Build offline no-ai
        run: pnpm run build:offline:no-ai

      - name: Build offline internal-ai
        run: pnpm run build:offline:internal-ai

      - name: Build enterprise
        run: pnpm run build:enterprise

      - name: Build dataverse
        run: pnpm run build:dataverse

      - name: Upload offline build
        uses: actions/upload-artifact@v4
        with:
          name: dist-offline
          path: dist/offline/index.html
          retention-days: 30

      - name: Upload offline no-ai build
        uses: actions/upload-artifact@v4
        with:
          name: dist-offline-no-ai
          path: dist/offline-no-ai/index.html
          retention-days: 30

      - name: Upload offline internal-ai build
        uses: actions/upload-artifact@v4
        with:
          name: dist-offline-internal-ai
          path: dist/offline-internal-ai/index.html
          retention-days: 30

      - name: Upload enterprise build
        uses: actions/upload-artifact@v4
        with:
          name: dist-enterprise
          path: dist/enterprise/
          retention-days: 30

      - name: Upload dataverse build
        uses: actions/upload-artifact@v4
        with:
          name: dist-dataverse
          path: dist/dataverse/
          retention-days: 30

name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Build offline
        run: pnpm run build:offline

      - name: Build sync
        run: pnpm run build:sync

      - name: Build dataverse
        run: pnpm run build:dataverse

      - name: Upload offline build
        uses: actions/upload-artifact@v4
        with:
          name: dist-offline
          path: dist/offline/index.html
          retention-days: 30

      - name: Upload sync build
        uses: actions/upload-artifact@v4
        with:
          name: dist-sync
          path: dist/sync/
          retention-days: 30

      - name: Upload dataverse build
        uses: actions/upload-artifact@v4
        with:
          name: dist-dataverse
          path: dist/dataverse/
          retention-days: 30

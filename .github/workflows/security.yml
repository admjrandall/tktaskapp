name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

jobs:
  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=moderate

      - name: Gitleaks — secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Semgrep runs community rules with no token required.
      # To upgrade to Pro rules + cross-file dataflow (free for ≤10 contributors):
      #   1. Create account at https://semgrep.dev
      #   2. Generate token: https://semgrep.dev/orgs/-/settings/tokens
      #   3. Add repo secret SEMGREP_APP_TOKEN
      #   4. Replace the run: block below with:
      #        uses: semgrep/semgrep-action@v1
      #        env: { SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }} }
      - name: Semgrep — SAST (community rules)
        run: |
          pip install semgrep --quiet
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/cwe-top-25 \
            --sarif \
            --quiet \
            . > semgrep.sarif
        continue-on-error: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Bearer — SAST + Privacy (OWASP / GDPR / HIPAA patterns)
        uses: bearer/bearer-action@v2
        with:
          format: sarif
          output: bearer.sarif
          exit-code: "0"
          skip-path: "dist,node_modules,taskapp.html,originalfiles"

      - name: Upload Bearer SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('bearer.sarif') != ''
        with:
          sarif_file: bearer.sarif
          category: bearer

      - name: License compliance check
        run: |
          npx license-checker --onlyAllow \
            "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;Unlicense;0BSD;BlueOak-1.0.0" \
            --excludePrivatePackages

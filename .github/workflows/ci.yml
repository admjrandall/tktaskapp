name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: Typecheck · Lint · Build · Test · Assert
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskapp_test
          POSTGRES_USER: taskapp
          POSTGRES_PASSWORD: taskapp_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_API: ${{ secrets.TURBO_API }}
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_OTEL_TRACE_ENDPOINT: ${{ secrets.TURBO_OTEL_TRACE_ENDPOINT }}
      # DB-backed test URLs — used by server-rls-coverage, audit-chain, and revocation tests
      POSTGRES_TEST_URL: postgresql://taskapp:taskapp_test_pw@localhost:5432/taskapp_test
      AUTH_STATE_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a
        with:
          version: 11.1.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Validate committed SQL migrations
        run: pnpm run validate:migrations

      - name: Apply DB migrations for integration tests
        run: pnpm --filter @tktaskapp/server run db:migrate
        env:
          DATABASE_URL: postgresql://taskapp:taskapp_test_pw@localhost:5432/taskapp_test

      - name: Build offline (browser-ai profile)
        run: pnpm run build:offline

      - name: Build offline (no-ai profile)
        run: pnpm run build:offline:no-ai

      - name: Build offline (internal-ai profile)
        run: pnpm run build:offline:internal-ai

      - name: Test
        run: pnpm run test

      - name: Assert — no forbidden strings in offline bundle
        run: pnpm run assert:offline-bundle

      - name: Assert — bundle size budgets
        run: pnpm run assert:bundle-size

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E — golden path (offline build)
        run: pnpm exec playwright test tests/e2e/golden-path.spec.ts --reporter=list
        continue-on-error: false

      - name: E2E — accessibility (offline build)
        run: pnpm exec playwright test tests/e2e/accessibility/ --reporter=list
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload offline build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-offline
          path: dist/offline/index.html
          retention-days: 30

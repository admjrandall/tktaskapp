name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: Typecheck · Lint · Build · Assert
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Validate committed SQL migrations
        run: pnpm run validate:migrations

      - name: Build offline (browser-ai profile)
        run: pnpm run build:offline

      - name: Build offline (no-ai profile)
        run: pnpm run build:offline:no-ai

      - name: Build offline (internal-ai profile)
        run: pnpm run build:offline:internal-ai

      - name: Assert — no forbidden strings in offline bundle
        run: pnpm run assert:offline-bundle

      - name: Assert — bundle size budgets
        run: pnpm run assert:bundle-size

      - name: Upload offline build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-offline
          path: dist/offline/index.html
          retention-days: 30

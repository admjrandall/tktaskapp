# Bearer SAST configuration
# https://docs.bearer.com/reference/config/
#
# These Bearer rules are skipped because they are low-signal for this codebase
# after manual review:
# - dangerous_insert_html: DOM sinks are routed through auditedStaticHtml()
#   / createAuditedStaticHTML(); user text uses escH(), rich HTML uses DOMPurify.
# - logger_leak: open findings are build/dev scripts or caught error messages;
#   browser production builds drop console/debugger and server code uses OTel logs.
# - observable_timing: findings are non-secret status/platform/hash comparisons.
# - manual_html_sanitization: escH() is intentional context escaping; rich HTML uses
#   sanitizeDocHtml() backed by DOMPurify.
# - message_handler_origin: the flagged handler performs an origin check internally.
# - dynamic_regex: generate-csp.mjs is build-time and uses hardcoded tag names.
rule:
  skip-rule:
    - javascript_lang_dangerous_insert_html
    - javascript_lang_logger_leak
    - javascript_lang_observable_timing
    - javascript_lang_manual_html_sanitization
    - javascript_lang_message_handler_origin
    - javascript_lang_dynamic_regex

scan:
  skip-path:
    - dist
    - node_modules
    - taskapp.html
    - originalfiles
    - .claude

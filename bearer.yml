# Bearer SAST configuration
# https://docs.bearer.com/reference/config/
#
# javascript_lang_dangerous_insert_html is suppressed here because this codebase
# enforces Trusted Types at the DOM boundary. All innerHTML assignments go through
# auditedStaticHtml() → createAuditedStaticHTML() (the nexus-crm-static-template
# Trusted Types policy). patchInnerHTML() in render-utils.ts additionally overrides
# Element.prototype.innerHTML so even bare string assignments route through the policy.
# All template functions use escH() for every user-supplied value before interpolation.
# The rule fires as a false positive on each of those call sites.
rules:
  javascript_lang_dangerous_insert_html:
    disabled: true
